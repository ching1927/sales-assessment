<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登記&amp;健檢</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<style>
/* 公版 tokens 沒有的兩個中性色（與其他頁相同）：純白（按鈕字、對話框底）、對話框遮罩 */
body{--surface-solid:#fff;--scrim:rgba(15,23,42,0.30)}
[hidden]{display:none!important}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
button:disabled{cursor:not-allowed;opacity:.5}
.page{max-width:1100px;margin:0 auto;padding:var(--sp-4)}
/* 版面沿用「健檢與建議單樣品」（老闆已確認） */
.panel{padding:var(--sp-6);margin-bottom:var(--sp-4)}
.sub{font-size:13px;color:var(--ink-2);line-height:1.6}
.note{font-size:13px;color:var(--ink-2);line-height:1.7}
.mono{font-family:var(--mono)}
.ctrl{padding:9px 12px;border-radius:var(--r-ctrl);border:0.5px solid var(--ink-line);background:var(--glass-bg-strong);min-height:40px;font-size:15px;font-family:inherit;color:var(--ink)}
.ctrl.sm{min-height:34px;padding:5px 10px;font-size:14px}
textarea.ctrl{width:100%;min-height:72px;resize:vertical}
.btn{padding:8px 16px;min-height:38px;border-radius:var(--r-ctrl);border:0.5px solid var(--rim);background:var(--glass-bg-strong);color:var(--ink);font-size:14px;font-weight:600;box-shadow:var(--specular),var(--hairline);cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block;transition:transform var(--dur-micro) var(--ease)}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.sm{padding:4px 12px;min-height:30px;font-size:13px}
.btn.danger{color:var(--danger)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th,table.list td{padding:10px 10px;text-align:left;border-bottom:1px solid var(--ink-line);white-space:nowrap;vertical-align:middle}
table.list tbody tr:last-child td{border-bottom:none}
table.list th{font-size:12px;color:var(--ink-2)}
table.list td.num,table.list th.num{text-align:right;font-family:var(--mono)}
th.stick,td.stick{position:sticky;right:0;background:var(--surface-solid);box-shadow:-6px 0 8px -6px rgba(15,23,42,.18)}
#rosterTable{min-width:760px}
.tag{display:inline-block;padding:3px 10px;border-radius:var(--r-pill);font-size:12px;font-weight:700;background:var(--info-soft);color:var(--accent-deep)}
.tag.new{background:var(--info-soft);color:var(--accent-deep)}
.tag.reg{background:var(--track);color:var(--ink-2)}
.tag.unk{background:var(--warning-soft);color:var(--warning)}
.tag.on{background:var(--success-soft);color:var(--success)}
.tag.out{background:var(--danger-soft);color:var(--danger)}
.tag.first{background:var(--ci-yellow);color:var(--ci-black)}
.msg{font-size:13px;line-height:1.5;padding:8px 12px;border-radius:var(--r-sm);margin:var(--sp-2) 0}
.msg.err{background:var(--danger-soft);color:var(--danger);font-weight:600}
.msg.info{background:var(--info-soft);color:var(--accent-deep);font-weight:600}
.empty{padding:var(--sp-8);text-align:center;color:var(--ink-2)}
.foot{margin:var(--sp-6) 0 var(--sp-4)}
.loading{padding:var(--sp-12) var(--sp-4);text-align:center;color:var(--ink-2)}
.blocked{max-width:420px;margin:var(--sp-12) auto 0;padding:var(--sp-8) var(--sp-6);text-align:center}
.blocked p{font-size:15px;line-height:1.6;margin-bottom:var(--sp-4)}
.who b{display:block;font-size:14px}
.who small{display:block;color:var(--ink-3);font-size:12px}
.opwrap{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.ophint{display:block;font-size:12px;color:var(--ink-2);white-space:normal;max-width:240px;margin-top:4px;line-height:1.5}

/* 頁內分頁與頂列 */
.tophead{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center;justify-content:space-between;margin:0 0 var(--sp-4)}
.pgtabs{display:flex;gap:6px;padding:5px;border-radius:var(--r-pill);background:var(--track);width:max-content;max-width:100%;overflow-x:auto}
.pgtab{padding:9px 22px;border-radius:var(--r-pill);border:0;background:transparent;font-size:15px;font-weight:700;color:var(--ink-2);cursor:pointer;font-family:inherit;white-space:nowrap}
.pgtab{text-decoration:none;display:inline-block}
.pgtab:hover{color:var(--ink)}
.pgtab.on{background:var(--ci-black);color:var(--ci-yellow);box-shadow:0 2px 10px rgba(10,10,10,.25)}
.pane[hidden]{display:none}
@media (max-width:480px){.pgtab{padding:9px 12px;font-size:14px}}

/* 季次統計卡 */
.qcards{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-3);margin-bottom:var(--sp-4)}
.qcard{padding:var(--sp-4) var(--sp-6)}
.qcard small{display:block;font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:1px}
.qcard b{display:block;font-size:30px;font-weight:800;line-height:1.2;margin-top:2px}
.qcard b span{font-size:14px;font-weight:600;color:var(--ink-2);margin-left:2px}
.qcard em{display:block;font-style:normal;font-size:13px;color:var(--ink-2);margin-top:2px}
.qcard.now{box-shadow:0 0 0 2px var(--ci-yellow),var(--shadow)}
.savebar{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center;margin-top:var(--sp-4)}
.prevhead{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center;margin-bottom:var(--sp-3)}
.prevhead .grow{flex:1}
@media (max-width:760px){.qcards{grid-template-columns:repeat(2,1fr)}}

dialog{border:none;border-radius:var(--r-card);padding:0;max-width:460px;width:calc(100% - 32px);box-shadow:var(--shadow-lg);background:var(--surface-solid);margin:auto;color:var(--ink)}
dialog::backdrop{background:var(--scrim)}
.dlg{padding:var(--sp-6)}
.dlg h2{font-size:19px;margin:0 0 var(--sp-3)}
.dlg p{font-size:14px;line-height:1.6;color:var(--ink-2)}
.actions{display:flex;flex-wrap:wrap;gap:var(--sp-2);justify-content:flex-end;margin-top:var(--sp-4)}
.field{display:block;font-size:13px;color:var(--ink-2);font-weight:600;margin-top:var(--sp-3)}
.field .ctrl{display:block;width:100%;margin-top:6px;font-weight:400}
.field textarea{min-height:100px}
.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;max-width:calc(100% - 32px);padding:12px 20px;border-radius:var(--r-ctrl);
  background:var(--ink);color:var(--surface-solid);font-weight:600;font-size:14px;box-shadow:var(--shadow-lg)}
@media (max-width:640px){
  .panel{padding:var(--sp-4)}
}
@media (max-width:480px){
  .dlg{padding:var(--sp-4)}
  .fieldrow{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="page">
  <div class="loading" id="loading" role="status">載入中…</div>

  <section class="blocked glass" id="blocked" hidden>
    <p id="blockedText"></p>
    <button class="btn" id="blockedLogout" type="button">登出</button>
  </section>

  <div id="app" hidden>
    <header class="ab-bar">
      <div class="ab-in">
        <a class="ab-brand" href="roster.html" aria-label="貳輪嶼 MOTOR ISLAND"><img src="img/logo-white.png" alt="貳輪嶼 MOTOR ISLAND"></a>
        <nav class="ab-tabs" aria-label="主要功能">
        <a class="ab-tab" href="roster.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>人員名冊</a>
        <a class="ab-tab" id="toAssess" hidden href="assess.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>進行考核</a>
        <a class="ab-tab" href="backoffice.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>成績單&amp;考核後台</a>
        <a class="ab-tab" href="requests.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>待考回報</a>
        <a class="ab-tab on" href="spotcheck.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></svg>登記&amp;健檢</a>
        <a class="ab-tab" id="toQuestions" hidden href="questions.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>題庫管理</a>
        <a class="ab-tab" id="toAccounts" hidden href="accounts.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>帳號管理</a>
        </nav>
        <div class="ab-me">
          <div class="ab-me-txt"><b id="whoEmail"></b><span class="ab-role" id="whoBadge"></span></div>
          <div class="ab-avatar" id="whoAvatar" aria-hidden="true"></div>
          <button class="ab-icon" id="logout" type="button" aria-label="登出" title="登出"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></button>
        </div>
      </div>
    </header>
    <section class="ab-hero">
      <div class="ab-crumb">考核　/　登記&amp;健檢</div>
      <h1>登記&amp;健檢</h1>
    </section>

    <div class="msg err" id="pageMsg" role="alert" hidden></div>

    <div class="tophead">
      <div class="pgtabs" role="tablist" aria-label="登記&amp;健檢分頁">
        <a class="pgtab" id="tabReg" role="tab" aria-selected="false" href="spotcheck.html#reg" hidden>登記</a>
        <a class="pgtab" role="tab" aria-selected="false" href="spotcheck.html#records">登記歷程</a>
        <button type="button" class="pgtab on" role="tab" data-pane="paneStores" aria-selected="true">門市季次表</button>
        <button type="button" class="pgtab" role="tab" data-pane="paneList" aria-selected="false">健檢單</button>
      </div>
    </div>

    <!-- ① 門市季次表 -->
    <section class="pane" id="paneStores" role="tabpanel">
      <div class="qcards" id="qcards"></div>
      <section class="glass panel">
        <p class="sub" id="storeHint" style="margin-bottom:var(--sp-3)"></p>
        <div class="msg err" id="storeErr" role="alert" hidden></div>
        <div class="scroll" tabindex="0" aria-label="門市季次表，可左右捲動"><table class="list"><thead><tr><th>門市</th><th>健檢季</th><th class="num">約人數</th></tr></thead><tbody id="storeBody"></tbody></table></div>
        <div class="empty" id="storeEmpty" hidden>沒有門市資料</div>
        <div class="savebar" id="saveBar" hidden><button type="button" class="btn primary" id="saveStores">儲存</button><span class="sub" id="storeSum"></span></div>
        <p class="sub" id="storeSumRo" style="margin-top:var(--sp-3)" hidden></p>
      </section>
    </section>

    <!-- ② 健檢單：該季有抽查紀錄的業務（用 spot_inspections 現算，不另存） -->
    <section class="pane" id="paneList" role="tabpanel" hidden>
      <section class="glass panel">
        <div class="prevhead">
          <label for="listYear" class="sub">年度</label><select id="listYear" class="ctrl"></select>
          <label for="listQ" class="sub">季次</label><select id="listQ" class="ctrl"></select>
          <span class="grow sub" id="listInfo" aria-live="polite"></span>
          <label for="listStore" class="sub" id="listStoreLb">門市</label><select id="listStore" class="ctrl"></select>
        </div>
        <p class="sub" style="margin-bottom:var(--sp-3)">季次是日曆季（Q1＝1–3 月、Q2＝4–6 月、Q3＝7–9 月、Q4＝10–12 月），以抽查日期計；這一季沒有抽查紀錄的人不會出現。</p>
        <div class="msg err" id="listMsg" role="alert" hidden></div>
        <div class="msg info" id="pdfMsg" role="status" hidden></div>
        <div class="scroll" tabindex="0" aria-label="健檢單清單，可左右捲動"><table class="list" id="rosterTable"><thead><tr><th>人員</th><th>門市</th><th class="num">本季抽查次數</th><th class="num">待加強回覆次數</th><th>被勾最多的面向</th><th class="stick">操作</th></tr></thead><tbody id="listBody"></tbody></table></div>
        <div class="empty" id="listEmpty" hidden>這一季沒有抽查紀錄。</div>
      </section>
    </section>

    <p class="note" id="roleNote" style="margin-top:var(--sp-4)"></p>
  </div>

  <p class="foot">由 貳輪嶼 製作</p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/checkup-core.js"></script>
<script src="js/scoring.js"></script>
<script src="js/grade3-core.js"></script>
<script src="js/report-pdf-core.js"></script>
<script src="js/spotdims-core.js"></script>
<script src="js/checkup-sheet-core.js"></script>
<script src="js/checkup-api.js"></script>
<script src="js/checkup-sheet-pdf.js"></script>
<script>
(function () {
  var C = CheckupCore, SC = CheckupSheetCore;
  var ROLE_LABEL = { cs_admin: '客服部', hq_viewer: '總公司主管', store_manager: '店長' };

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ====== 狀態 ======
  var me = null;
  var qrows = [];          // checkup_quarters_list 的結果
  var pending = {};        // 客服部尚未儲存的選擇 { 門市代碼: 季次 }
  var sheets = [], sheetSeq = 0, sheetsLoaded = false;   // 健檢單清單（現算自抽查紀錄）
  var busy = false;
  var now = C.taipeiYearQuarter();

  function isCS() { return !!me && me.role === 'cs_admin'; }
  function isMgr() { return !!me && me.role === 'store_manager'; }
  function errText(e) { return (e && e.userMessage) || CheckupApi.explain(e); }
  function goLogin(reason) { location.replace('index.html' + (reason ? '?reason=' + reason : '')); }
  function doLogout() { CheckupApi.signOut().then(function () { goLogin(''); }); }
  function showBlocked(text) {
    $('loading').hidden = true; $('app').hidden = true;
    $('blockedText').textContent = text; $('blocked').hidden = false;
  }
  function showMsg(id, t) { var m = $(id); m.textContent = t || ''; m.hidden = !t; }
  function toast(t) {
    var el = $('toast'); el.textContent = t; el.hidden = false;
    clearTimeout(toast.tm); toast.tm = setTimeout(function () { el.hidden = true; }, 3200);
  }
  function sName(code) {
    for (var i = 0; i < qrows.length; i++) if (qrows[i].store_code === code) return qrows[i].store_name || code;
    return code || '—';
  }

  // ====== 分頁 ======
  function showPane(id) {
    Array.prototype.forEach.call(document.querySelectorAll('.pane'), function (p) { p.hidden = p.id !== id; });
    Array.prototype.forEach.call(document.querySelectorAll('.pgtab'), function (b) {
      var on = b.getAttribute('data-pane') === id; b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    if (id === 'paneList' && !sheetsLoaded) loadSheets();
  }
  var HASH_PANE = { stores: 'paneStores', list: 'paneList' };
  var PANE_HASH = { paneStores: 'stores', paneList: 'list' };
  document.querySelector('.pgtabs').addEventListener('click', function (e) {
    var b = e.target.closest('button.pgtab'); if (!b) return;
    var id = b.getAttribute('data-pane'); showPane(id);
    try { history.replaceState(null, '', '#' + PANE_HASH[id]); } catch (x) {}
  });
  function openByHash() { showPane(HASH_PANE[(location.hash || '').replace('#', '')] || 'paneStores'); }
  window.addEventListener('hashchange', openByHash);

  // ====== ① 門市季次表 ======
  function renderStores() {
    var rows = C.sortStores(qrows, 'store_code');
    $('storeEmpty').hidden = rows.length > 0;
    $('storeBody').innerHTML = rows.map(function (r) {
      var q = pending[r.store_code] || r.quarter;
      var cell = isCS()
        ? '<select class="ctrl sm" data-store="' + esc(r.store_code) + '" aria-label="' + esc(r.store_name || r.store_code) + ' 健檢季"' + (busy ? ' disabled' : '') + '>' +
          C.QUARTERS.map(function (n) { return '<option value="' + n + '"' + (Number(q) === n ? ' selected' : '') + '>Q' + n + '</option>'; }).join('') + '</select>'
        : '<span class="tag reg">Q' + esc(r.quarter) + '</span>';
      return '<tr><td><b>' + esc(r.store_name || r.store_code) + '</b></td><td>' + cell + '</td><td class="num">' + esc(r.headcount == null ? '—' : r.headcount) + '</td></tr>';
    }).join('');
    updateStats();
  }
  function updateStats() {
    var stats = C.quarterStats(qrows, pending), totS = 0, totP = 0;
    $('qcards').innerHTML = stats.map(function (s) {
      totS += s.stores; totP += s.people;
      var cur = s.quarter === now.quarter;
      return '<div class="glass qcard' + (cur ? ' now' : '') + '"><small>Q' + s.quarter + (cur ? '　（本季）' : '') + '</small><b>' + s.stores + '<span>家門市</span></b><em>約 ' + s.people + ' 人</em></div>';
    }).join('');
    var sum = '合計 ' + totS + ' 家門市、約 ' + totP + ' 人';
    var n = C.changedStores(qrows, pending).length;
    if (isCS()) {
      $('storeSum').textContent = sum + (n ? '（有 ' + n + ' 家尚未儲存）' : '');
      $('saveStores').disabled = busy || n === 0;
    } else {
      $('storeSumRo').textContent = sum;
    }
  }
  $('storeBody').addEventListener('change', function (e) {
    var s = e.target.getAttribute('data-store'); if (!s || !isCS() || busy) return;
    pending[s] = Number(e.target.value);
    showMsg('storeErr', '');
    updateStats();
  });
  $('saveStores').addEventListener('click', function () {
    if (!isCS() || busy) return;
    var list = C.changedStores(qrows, pending);
    if (!list.length) return;
    busy = true; $('saveStores').disabled = true; showMsg('storeErr', '');
    var done = 0, failMsg = '';
    // 一家一家存；遇到失敗就停，已存的保留
    list.reduce(function (p, it) {
      return p.then(function () {
        if (failMsg) return;
        return CheckupApi.setQuarter(it.store, it.quarter).then(function () { done++; delete pending[it.store]; },
          function (e) { failMsg = '「' + sName(it.store) + '」儲存失敗：' + errText(e); });
      });
    }, Promise.resolve()).then(function () {
      return CheckupApi.quarters().then(function (rows) { qrows = rows; }, function (e) {
        failMsg = (failMsg ? failMsg + '　' : '') + '已儲存，但重新載入失敗：' + errText(e) + ' 請重新整理頁面。';
      });
    }).then(function () {
      busy = false;
      if (failMsg) showMsg('storeErr', (done ? '已儲存 ' + done + ' 家；' : '') + failMsg);
      else toast('門市季次已儲存。這只是各門市的季次紀錄，不影響每季健檢單。');
      renderStores(); refreshStoreOptions();
    });
  });

  // ====== ② 健檢單（每季抽查彙整；清單與 PDF 都用 spot_inspections 該季資料現算，RLS 已限制可見範圍）======
  function selYear() { return Number($('listYear').value); }
  function selQ() { return Number($('listQ').value); }
  function refreshStoreOptions() {
    var keep = $('listStore').value, seen = {}, opts = [];
    function add(code, name) { if (code && !seen[code]) { seen[code] = true; opts.push({ store_code: code, store_name: name || code }); } }
    qrows.forEach(function (r) { add(r.store_code, r.store_name); });
    sheets.forEach(function (s) { add(s.store_code, sName(s.store_code)); });
    opts = C.sortStores(opts, 'store_code');
    $('listStore').innerHTML = '<option value="">全部門市</option>' + opts.map(function (o) {
      return '<option value="' + esc(o.store_code) + '">' + esc(o.store_name) + '</option>';
    }).join('');
    $('listStore').value = opts.some(function (o) { return o.store_code === keep; }) ? keep : '';
  }
  function loadSheets() {
    var y = selYear(), q = selQ(), seq = ++sheetSeq, rg = SC.quarterRange(y, q);
    sheetsLoaded = true;
    showMsg('listMsg', ''); showMsg('pdfMsg', '');
    sheets = []; renderSheets(true);
    CheckupApi.sheetInspections(rg.start, rg.end).then(function (rows) {
      if (seq !== sheetSeq) return;      // 已切換年度或季次，舊回應不採用
      sheets = SC.summarize(rows); refreshStoreOptions(); renderSheets(false);
    }, function (e) {
      if (seq !== sheetSeq) return;
      showMsg('listMsg', '讀取健檢單失敗：' + errText(e));
      sheets = []; refreshStoreOptions(); renderSheets(false);
      sheetsLoaded = false;
    });
  }
  function renderSheets(loading) {
    var y = selYear(), q = selQ();
    var rows = SC.filterByStore(sheets, isMgr() ? '' : $('listStore').value);
    $('listInfo').textContent = loading ? '載入中…' : SC.quarterLabel(y, q) + '　共 ' + rows.length + ' 人有抽查紀錄';
    $('listEmpty').hidden = loading || rows.length > 0 || !!$('listMsg').textContent;
    $('listBody').innerHTML = rows.map(function (r) {
      return '<tr>' +
        '<td class="who"><b>' + esc(r.name) + '</b><small class="mono">' + esc(r.employee_id) + '</small></td>' +
        '<td>' + esc(sName(r.store_code)) + '</td>' +
        '<td class="num">' + r.total + '</td>' +
        '<td class="num">' + r.weak + '</td>' +
        '<td>' + (r.top.length ? r.top.map(function (d) { return '<span class="tag">' + esc(d) + '</span>'; }).join(' ') : '<span class="sub">—</span>') + '</td>' +
        '<td class="stick"><button type="button" class="btn sm primary" data-e="' + esc(r.employee_id) + '">下載 PDF</button></td></tr>';
    }).join('');
  }
  ['listYear', 'listQ'].forEach(function (id) { $(id).addEventListener('change', loadSheets); });
  $('listStore').addEventListener('change', function () { renderSheets(false); });

  $('listBody').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var r = null;
    for (var i = 0; i < sheets.length; i++) if (sheets[i].employee_id === b.dataset.e) { r = sheets[i]; break; }
    if (!r) return;
    showMsg('pdfMsg', '');
    CheckupSheetPdf.run({ sum: r, year: selYear(), quarter: selQ(), storeName: sName(r.store_code), btn: b, msgEl: $('pdfMsg') });
  });

  // ====== 載入與角色 ======
  function applyRole() {
    var lab = ROLE_LABEL[me.role] + (me.role === 'store_manager' ? '・' + sName(me.store_code) : '');
    $('whoBadge').textContent = lab;
    $('toAssess').hidden = !isCS(); $('toAccounts').hidden = !isCS(); $('toQuestions').hidden = !isCS();
    $('tabReg').hidden = !isCS();      // 登記分頁只有客服部看得到（在 spotcheck.html）
    $('saveBar').hidden = !isCS();
    $('listStore').hidden = isMgr(); $('listStoreLb').hidden = isMgr();   // 店長固定自己門市（資料庫只給自己門市），不顯示門市篩選
    $('storeSumRo').hidden = isCS();
    $('storeHint').textContent = isCS()
      ? '請為每家門市選擇它的健檢季；改完上方統計會即時更新，按「儲存」才會生效。這只是各門市的季次紀錄，不影響每季健檢單。'
      : me.role === 'store_manager' ? '這是你門市的健檢季；季次由客服部指定。' : '各門市的健檢季由客服部指定，這裡只能查看。';
    $('roleNote').textContent = isCS() ? '客服部可改門市季次；健檢單可下載 PDF（用該季抽查紀錄現算，不另存、不計分）。'
      : me.role === 'store_manager' ? '只顯示自己門市；門市季次只能查看，健檢單可下載 PDF。'
      : '總公司主管門市季次只能查看；健檢單可查看與下載 PDF。';
  }

  $('logout').addEventListener('click', doLogout);
  $('blockedLogout').addEventListener('click', doLogout);
  CheckupApi.onSignedOut(function () { goLogin(''); });

  // ====== 啟動：登入、網域、開通三道檢查 ======
  CheckupApi.getSession().then(function (session) {
    if (!session) { goLogin(''); return; }
    var email = (session.user && session.user.email) || '';
    if (!/@2motor\.tw$/i.test(email)) {
      CheckupApi.signOut().then(function () { goLogin('domain'); });
      return;
    }
    $('whoEmail').textContent = email;
    return CheckupApi.loadMe(email).then(function (row) {
      if (!row || !ROLE_LABEL[row.role]) { showBlocked('你的帳號尚未開通，請聯絡客服部。'); return; }
      me = row;
      // 名單頁的年度、季次下拉：預設今天（台北時間）所在的年與季
      $('listYear').innerHTML = C.yearOptions().map(function (y) { return '<option value="' + y + '">' + y + '</option>'; }).join('');
      $('listQ').innerHTML = C.QUARTERS.map(function (n) { return '<option value="' + n + '">Q' + n + '</option>'; }).join('');
      $('listYear').value = String(now.year); $('listQ').value = String(now.quarter);
      $('loading').hidden = true; $('app').hidden = false;
      applyRole(); openByHash();
      return CheckupApi.quarters().then(function (rows) {
        qrows = rows; applyRole(); renderStores(); refreshStoreOptions();
        if (sheets.length) renderSheets(false);   // 門市名稱晚到時，把已顯示的清單重畫一次
      }, function (e) {
        showMsg('pageMsg', '讀取門市季次失敗：' + errText(e));
        renderStores();
      });
    });
  }).catch(function (e) {
    showBlocked(errText(e) || '載入失敗，請重新整理頁面。');
  });
})();
</script>
<script src="js/appbar.js"></script>
</body>
</html>
