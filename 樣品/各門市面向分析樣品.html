<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>各門市面向分析樣品（假資料）</title>
<style>
:root{--ink:#0A0A0A;--ink-2:#4A4F5A;--line:rgba(15,23,42,.10);--ci-black:#0A0A0A;--ci-blue:#0669EB;--ci-yellow:#D9FF00;--danger:#DC2626;
--font:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Helvetica Neue",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:linear-gradient(180deg,#FAFAFA,#F0F2F5);min-height:100vh;padding-bottom:40px}
.note{max-width:1040px;margin:12px auto 0;padding:10px 16px;font-size:13px;color:var(--ink-2)}
main{max-width:1040px;margin:0 auto;padding:0 16px}
.pgtabs{display:flex;gap:6px;padding:5px;border-radius:999px;background:#E6E9EE;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:14px}
.pgtab{padding:9px 22px;border-radius:999px;border:0;background:transparent;font-size:15px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.pgtab.on{background:var(--ci-black);color:var(--ci-yellow)}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:14px;color:var(--ink-2)}
select{font:inherit;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink)}
/* 切換：同一頁兩種榜 */
.sw{display:inline-flex;background:#EEF1F5;border-radius:999px;padding:4px;gap:4px;margin-bottom:12px}
.sw button{border:0;background:transparent;padding:9px 20px;border-radius:999px;font-weight:800;font-size:15px;color:var(--ink-2);cursor:pointer;font-family:inherit}
.sw button.on{background:var(--ci-blue);color:#fff}
.hd{background:#0A0A0A;color:#fff;padding:10px 24px;border-radius:8px;position:relative;margin-bottom:14px;overflow:hidden}
.hd::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:#D9FF00}
.hd small{color:#D9FF00;font-weight:700;letter-spacing:1.5px;font-size:11px}
.hd h3{font-size:20px;font-weight:800}
.hd p{font-size:12.5px;color:rgba(255,255,255,.75)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
@media(max-width:700px){.sum{grid-template-columns:1fr}}
.sc{border-radius:8px;padding:8px 12px}.sc small{display:block;font-size:11.5px;font-weight:800}.sc b{font-size:16px;line-height:1.4;display:block}
.sc.g{background:#EAF2EE;color:#226347}.sc.r{background:#FBEDEB;color:#B53A2D}.sc.b{background:#EAF1FB;color:#1F5FB4}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
th{background:#F3F5F8;font-size:12.5px;padding:8px 6px;text-align:center;border-bottom:1px solid #E3E7ED;white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid #E3E7ED;text-align:center;white-space:nowrap}
th.nm,td.nm{text-align:left;font-weight:700}
td.rk{font-weight:900;font-size:17px;width:50px}
.cell{border-radius:6px;padding:5px 2px;font-weight:700;min-width:62px}
.cell small{display:block;font-weight:500;font-size:11px;opacity:.75}
th.sel{background:#FFF3C4}
tr.me td.nm{background:#FFFBD6}.you{font-size:11px;color:#8A6D00;font-weight:800;margin-left:8px}
.top{font-size:12px;font-weight:800;color:#B53A2D}
.hint{font-size:12px;color:#6B7280;margin-top:10px;line-height:1.7}
.dl{display:flex;gap:8px;margin-left:auto}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 16px;font-weight:800;font-size:14px}
.btn.p{background:var(--ci-blue);color:#fff;border-color:var(--ci-blue)}
</style>
</head>
<body>
<div class="note">樣品（全部是假資料）。這是「登記&健檢」→「異常回覆預警榜」同一頁，多了上方的切換「異常回覆張數｜各門市面向分析」。點「各門市面向分析」，再試著改「排序依據」。</div>
<main>
  <div class="pgtabs"><button class="pgtab">登記</button><button class="pgtab">登記歷程</button><button class="pgtab">健檢單</button><button class="pgtab on">異常回覆預警榜</button></div>
  <section class="panel">
    <div class="ctl">年度 <select><option>2026</option></select> 期間 <select><option>第4季</option></select>
      <span>2026 年 第4季　共 8 家門市</span>
      <div class="dl"><button class="btn">下載圖片</button><button class="btn p">下載 PDF</button></div></div>
    <div class="sw" id="sw"><button data-v="count">異常回覆張數</button><button data-v="dim" class="on">各門市面向分析</button></div>
    <div id="view"></div>
  </section>
</main>
<script>
var DIMS=['資訊正確性','預設訊息運用','問題掌握','主動引導','風險意識','語氣與禮貌','文字品質'];
// 假資料：每家門市「當季登記次數」與各面向被勾次數
var ST=[
 {n:'新莊',c:34,d:[3,1,4,2,0,5,1]},{n:'樹林',c:28,d:[1,0,2,1,1,2,0]},{n:'桃園中壢',c:41,d:[6,2,7,4,1,3,2]},
 {n:'新竹',c:30,d:[2,1,3,5,0,1,1]},{n:'旗艦',c:52,d:[4,3,5,3,2,6,4]},{n:'台南',c:22,d:[5,2,4,1,3,2,6]},
 {n:'台中',c:36,d:[2,2,1,1,0,2,1]},{n:'高雄',c:25,d:[1,1,2,0,0,1,0]}];
var ME='桃園中壢', sortKey='total';
function sum(a){return a.reduce(function(x,y){return x+y},0)}
function rate(s,i){return s.d[i]/s.c}
function val(s){return sortKey==='total'?sum(s.d)/s.c:rate(s,+sortKey)}
function heat(p,max){var a=max?p/max:0;return 'background:rgba(220,38,38,'+(0.08+a*0.5).toFixed(2)+');color:'+(a>0.7?'#7F1D1D':'#1f2937')}
function render(v){
  if(v==='count'){document.getElementById('view').innerHTML='<div class="hd"><small>REPLY ALERT BOARD</small><h3>各門市異常回覆預警榜｜2026 年 第4季</h3><p>（這裡是原本的排名頁，維持原樣）</p></div>';return}
  var rows=ST.slice().sort(function(a,b){return val(a)-val(b)});
  var maxRate=0;ST.forEach(function(s){DIMS.forEach(function(_,i){maxRate=Math.max(maxRate,rate(s,i))})});
  var all=DIMS.map(function(_,i){return sum(ST.map(function(s){return s.d[i]}))}), totC=sum(ST.map(function(s){return s.c}));
  var topI=all.indexOf(Math.max.apply(null,all));
  var worst=rows[rows.length-1],best=rows[0];
  var lab=sortKey==='total'?'全部面向合計':DIMS[+sortKey];
  var h='<div class="hd"><small>STORE DIMENSION BOARD</small><h3>各門市面向分析｜2026 年 第4季</h3><p>登記時被勾選的「可改善面向」，依門市彙整；比例＝被勾次數 ÷ 該門市當季登記次數。名次越前＝被勾比例越低。</p></div>'+
   '<div class="ctl">排序依據 <select id="sk"><option value="total">全部面向合計</option>'+DIMS.map(function(d,i){return '<option value="'+i+'">'+d+'</option>'}).join('')+'</select></div>'+
   '<div class="sum"><div class="sc g"><small>被勾比例最低（'+lab+'）</small><b>'+best.n+'　'+(val(best)*100).toFixed(0)+'%</b></div>'+
   '<div class="sc r"><small>被勾比例最高（'+lab+'）</small><b>'+worst.n+'　'+(val(worst)*100).toFixed(0)+'%</b></div>'+
   '<div class="sc b"><small>全公司最常被勾的面向</small><b>'+DIMS[topI]+'　'+all[topI]+' 次</b></div></div>'+
   '<div class="scroll"><table><thead><tr><th>名次</th><th class="nm">門市</th><th>登記次數</th>'+DIMS.map(function(d,i){return '<th class="'+(sortKey==String(i)?'sel':'')+'">'+d+'</th>'}).join('')+'<th>最常被勾</th></tr></thead><tbody>';
  rows.forEach(function(s,k){
    var mx=Math.max.apply(null,s.d), tops=DIMS.filter(function(_,i){return s.d[i]===mx&&mx>0});
    h+='<tr class="'+(s.n===ME?'me':'')+'"><td class="rk">'+(k+1)+'</td><td class="nm">'+s.n+(s.n===ME?'<span class="you">← 你的門市</span>':'')+'</td><td>'+s.c+'</td>'+
      s.d.map(function(x,i){return '<td><div class="cell" style="'+heat(rate(s,i),maxRate)+'">'+(rate(s,i)*100).toFixed(0)+'%<small>'+x+' 次</small></div></td>'}).join('')+
      '<td class="top">'+(tops.length?tops.join('、'):'—')+'</td></tr>';
  });
  h+='</tbody></table></div><p class="hint">・紅色越深＝該面向被勾的比例越高（越需要加強）。<br>・只算登記時勾的「可改善面向」（優良回覆也可能勾），舊制紀錄沒有勾選，不計入。<br>・只顯示各門市彙總，不含登記內容與人員姓名。</p>';
  document.getElementById('view').innerHTML=h;
  document.getElementById('sk').value=sortKey;
  document.getElementById('sk').onchange=function(){sortKey=this.value;render('dim')};
}
document.getElementById('sw').onclick=function(e){var b=e.target.closest('button');if(!b)return;[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)});render(b.dataset.v)};
render('dim');
</script>
</body>
</html>
