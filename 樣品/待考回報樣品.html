<title>待考回報樣品（假資料）</title>
<!-- inlined --><style>/* 公版 tokens（取自 2motor-design-system/assets/tokens.css，與樣品相同、未改值）＋兩頁共用的基礎樣式 */
:root{
  --glass-bg:rgba(255,255,255,0.62);
  --glass-bg-strong:rgba(255,255,255,0.80);
  --glass-blur:24px; --glass-sat:160%;
  --rim:rgba(255,255,255,0.9);
  --specular:inset 0 1px 1px rgba(255,255,255,0.9);
  --hairline:0 0 0 0.5px rgba(15,23,42,0.06);
  --shadow:0 8px 30px rgba(17,24,39,0.08);
  --shadow-lg:0 20px 60px rgba(17,24,39,0.16);
  --r-sm:10px; --r-ctrl:14px; --r-card:28px; --r-xl:34px; --r-pill:999px;
  --accent:#2F6BFF; --accent-soft:rgba(47,107,255,0.12); --accent-deep:#1E4FD0;
  --ink:#0F172A; --ink-2:#475569; --ink-3:#94A3B8; --ink-line:rgba(15,23,42,0.08);
  --success:#16A34A; --warning:#D97706; --danger:#DC2626; --info:#2F6BFF;
  --success-soft:rgba(22,163,74,0.12); --warning-soft:rgba(217,119,6,0.12);
  --danger-soft:rgba(220,38,38,0.10); --info-soft:rgba(47,107,255,0.12);
  --track:rgba(15,23,42,0.10);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang TC","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",monospace;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px; --sp-8:32px; --sp-12:48px; --sp-16:64px;
  --ease:cubic-bezier(.22,1,.36,1);
  --dur-in:600ms; --dur-micro:250ms;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font); color:var(--ink); min-height:100vh; overflow-x:hidden;
  background:
    radial-gradient(70% 50% at 80% 0%, rgba(120,150,255,0.10) 0%, transparent 60%),
    radial-gradient(60% 50% at 8% 100%, rgba(170,150,255,0.08) 0%, transparent 60%),
    linear-gradient(180deg,#F7F8FB 0%,#EEF1F6 100%);
  -webkit-font-smoothing:antialiased;
}
.glass{
  background:var(--glass-bg);
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  border:0.5px solid var(--rim);
  box-shadow:var(--specular),var(--hairline),var(--shadow);
  border-radius:var(--r-card); position:relative; overflow:hidden;
}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 26%)}
.glass > *{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.foot{text-align:center;color:var(--ink-3);font-size:12px}
[hidden]{display:none!important}
.notice{background:var(--warning-soft);color:var(--warning);font-weight:600;font-size:14px;line-height:1.5;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-ctrl)}
.notice.bad{background:var(--danger-soft);color:var(--danger)}

/* 貳輪嶼 CI 版面：黑・藍・黃・白（老闆指定，覆寫公版單一藍）＋共用導覽列與頁首橫幅。各頁在 tokens.css 之後載入。 */
:root{--ci-black:#0A0A0A;--ci-blue:#0669EB;--ci-yellow:#D9FF00;
  --accent:#0669EB;--accent-deep:#0553BC;--accent-soft:rgba(6,105,235,.12);--info:#0669EB;--info-soft:rgba(6,105,235,.12);
  --ink:#0A0A0A;--ink-2:#4A4F5A;--ab-h:64px}
body{background:radial-gradient(60% 40% at 90% 0%,rgba(6,105,235,.08),transparent 60%),radial-gradient(50% 40% at 0% 100%,rgba(217,255,0,.12),transparent 60%),linear-gradient(180deg,#FAFAFA 0%,#F0F2F5 100%)}

/* ===== 導覽列（黑底、全寬、固定在最上方） ===== */
.ab-bar{position:sticky;top:0;z-index:50;margin:calc(-1 * var(--sp-4)) calc(50% - 50vw) 0;background:var(--ci-black);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.ab-in{max-width:1320px;margin:0 auto;padding:0 var(--sp-4);height:64px;display:flex;align-items:center;gap:var(--sp-4)}
.ab-brand{display:flex;align-items:center;flex:none;text-decoration:none}
.ab-brand img{height:38px;width:auto;display:block}
.ab-tabs{display:flex;gap:2px;padding:4px;border-radius:var(--r-pill);background:rgba(255,255,255,.09);margin:0 auto;overflow-x:auto;scrollbar-width:none}
.ab-tabs::-webkit-scrollbar{display:none}
.ab-tab{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r-pill);font-size:14px;font-weight:600;
  color:rgba(255,255,255,.74);text-decoration:none;white-space:nowrap;
  transition:background var(--dur-micro) var(--ease),color var(--dur-micro) var(--ease)}
.ab-tab svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ab-tab:hover{color:#fff;background:rgba(255,255,255,.14)}
.ab-tab.on{background:var(--ci-yellow);color:var(--ci-black);box-shadow:0 2px 12px rgba(217,255,0,.35)}
.ab-tab[hidden]{display:none}
.ab-me{display:flex;align-items:center;gap:var(--sp-3);flex:none}
.ab-me-txt{line-height:1.3;text-align:right}
.ab-me-txt b{display:block;font-size:13px;color:#fff;font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ab-role{display:inline-block;padding:2px 9px;border-radius:var(--r-pill);background:var(--ci-yellow);color:var(--ci-black);font-size:12px;font-weight:700}
.ab-role:empty{display:none}
.ab-avatar{width:34px;height:34px;border-radius:50%;background:var(--ci-yellow);color:var(--ci-black);font-weight:700;font-size:14px;display:grid;place-items:center}
.ab-icon{width:36px;height:36px;border-radius:50%;border:0.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.10);color:#fff;
  display:grid;place-items:center;transition:background var(--dur-micro) var(--ease)}
.ab-icon:hover{background:rgba(255,255,255,.2)}
.ab-icon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:1340px){
  :root{--ab-h:116px}
  .ab-in{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:10px;row-gap:10px}
  .ab-me{margin-left:auto}
  .ab-tabs{order:3;width:100%;margin:0}
  .ab-me-txt{display:none}
}

/* ===== 頁首橫幅 ===== */

  background:linear-gradient(135deg,#0A0A0A 0%,#14171F 100%);color:#fff;box-shadow:var(--shadow)}

.ab-hero>*{position:relative;z-index:1}
.ab-crumb{font-size:12px;font-weight:700;color:var(--ci-yellow);letter-spacing:1.5px;margin-bottom:var(--sp-2)}

th{font-weight:700;letter-spacing:.3px}

#formCol{scroll-margin-top:calc(var(--ab-h) + var(--sp-4))}

  .ab-me-txt{display:block}
  .ab-me-txt b{display:none}

<style>
.page{max-width:1100px;margin:0 auto;padding:var(--sp-4)}
h2{font-size:18px;margin:var(--sp-6) 0 var(--sp-3)}
.panel{padding:var(--sp-6);margin-bottom:var(--sp-4)}
.note{font-size:13px;color:var(--ink-2);line-height:1.7}
.sub{font-size:12px;color:var(--ink-3)}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:var(--r-pill);background:var(--track);margin:var(--sp-3) 0}
.seg button{border:0;background:transparent;padding:8px 18px;border-radius:var(--r-pill);font-size:14px;font-weight:700;color:var(--ink-2);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--ci-black);color:var(--ci-yellow)}
.ctrl{padding:9px 12px;border-radius:var(--r-ctrl);border:0.5px solid var(--ink-line);background:var(--glass-bg-strong);min-height:40px;font-size:15px;font-family:inherit;color:var(--ink);width:100%}
textarea.ctrl{min-height:72px;resize:vertical}
label.lb{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--sp-3);margin-bottom:var(--sp-3)}
.btn{padding:8px 16px;min-height:38px;border-radius:var(--r-ctrl);border:0.5px solid var(--rim);background:var(--glass-bg-strong);color:var(--ink);font-size:14px;font-weight:600;box-shadow:var(--specular),var(--hairline);cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.sm{padding:4px 12px;min-height:30px;font-size:13px}
.btn.danger{color:var(--danger)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--ink-line);vertical-align:top}
th{font-size:12px;color:var(--ink-2)}
.tag{display:inline-block;padding:3px 10px;border-radius:var(--r-pill);font-size:12px;font-weight:700}
.tag.wait{background:var(--ci-yellow);color:var(--ci-black)}
.tag.set{background:var(--accent-soft);color:var(--accent-deep)}
.tag.done{background:var(--track);color:var(--ink-2)}
.tag.no{background:var(--danger-soft);color:var(--danger)}
.tag.type{background:var(--ci-black);color:#fff}
.alert{border-radius:var(--r-ctrl);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-3);background:var(--accent-soft);color:var(--accent-deep);font-weight:600;font-size:14px;line-height:1.6}
.alert.red{background:var(--danger-soft);color:var(--danger)}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--danger);color:#fff;font-size:12px;font-weight:800;margin-left:6px}
.mail{border:1px dashed var(--ink-3);border-radius:var(--r-ctrl);padding:var(--sp-4);background:#fff;font-size:14px;line-height:1.8;margin-bottom:var(--sp-3)}
.mail b.h{display:block;font-size:12px;color:var(--ink-3);font-weight:700;margin-bottom:4px}
.row{display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:end;margin-bottom:var(--sp-3)}
.days{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-2)}
.days .d{display:flex;gap:6px;align-items:center}
.days input{width:170px}
.videoRow{margin:var(--sp-6) 0 var(--sp-6)}
.chk.need{color:var(--danger)}
.log.err{color:var(--danger);font-weight:700}
.days{margin-bottom:var(--sp-3)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.log{font-size:13px;color:var(--ink-2);margin-top:var(--sp-3);line-height:1.7}
</style>
</head>
<body>
<main class="page">
  <section class="ab-hero"><div class="ab-crumb">樣品　/　待考回報（假資料）</div><h1>店長回報待考，客服部收到通知與信件</h1></section>
  <p class="note">下方切換「店長」與「客服部」兩種身分看畫面。資料全是假的，操作不會存到任何地方；重新整理會回到初始狀態。試試看：用店長身分送出一筆回報 → 切到客服部看紅點與信件預覽 → 排定日期 → 切回店長看到通知。</p>
  <div class="seg" id="seg"><button type="button" data-r="mgr" class="on">店長（範例門市一）</button><button type="button" data-r="cs">客服部</button></div>

  <section id="vMgr">
    <div id="mgrNotice"></div>
    <h2>回報待考</h2>
    <section class="glass panel">
      <div class="grid">
        <div><label class="lb" for="mType">回報情況</label>
          <select class="ctrl" id="mType"><option value="新人">新人準備好了，要考核</option><option value="回考核期">回考核期的人，準備好再考</option><option value="複檢">改善單複檢考核</option></select></div>
        <div><label class="lb" for="mEmp">人員</label><select class="ctrl" id="mEmp"></select></div>
      </div>
      <label class="lb">希望考核日期（可多選，最多 3 個，至少 1 個）</label>
      <div class="days" id="mDays"></div>
      <button class="btn sm" id="mAddDay" type="button">＋ 再加一個日期</button>
      <div class="videoRow" id="videoRow"><label class="chk need"><input type="checkbox" id="mVideo"> 該同仁已看完「線上回覆實戰全攻略」影片</label></div>
      <label class="lb" for="mNote">備註（例如已完成哪些訓練、哪幾天可以來）</label>
      <textarea class="ctrl" id="mNote" placeholder="例：已完成報到與話術訓練，週三、週四下午可以考核"></textarea>
      <div class="row" style="margin-top:var(--sp-3)"><button class="btn primary" id="mGo" type="button">送出回報</button></div>
      <div class="log" id="mLog"></div>
    </section>
    <h2>我的回報</h2>
    <section class="glass panel" style="padding:0"><div class="scroll"><table>
      <thead><tr><th>送出時間</th><th>情況</th><th>人員</th><th>希望日期</th><th>狀態</th><th>客服部回覆</th><th></th></tr></thead>
      <tbody id="mBody"></tbody></table></div></section>
  </section>

  <section id="vCs" hidden>
    <h2>待考回報<span class="badge" id="csBadge">0</span></h2>
    <div class="row">
      <div><label class="lb" for="fStore">門市</label><select class="ctrl" id="fStore"><option value="">全部門市</option><option>範例門市一</option><option>範例門市二</option></select></div>
      <div><label class="lb" for="fStatus">狀態</label><select class="ctrl" id="fStatus"><option value="">全部狀態</option><option>待處理</option><option>已排定</option><option>已完成</option><option>已取消</option></select></div>
    </div>
    <section class="glass panel" style="padding:0"><div class="scroll"><table>
      <thead><tr><th>送出時間</th><th>門市／店長</th><th>情況</th><th>人員</th><th>希望日期</th><th>備註</th><th>狀態</th><th></th></tr></thead>
      <tbody id="cBody"></tbody></table></div></section>
    <h2>信件預覽</h2>
    <div class="mail" id="mailNew"></div>
    <div class="mail" id="mailSet"></div>
    <p class="note">信件只放摘要和連結，需要登入才看得到完整內容。寄信失敗時，回報照常成功，後台會記錄這封信寄成功或失敗，客服部仍可在系統內看到紅點與清單。</p>
  </section>
  <p class="foot">由 貳輪嶼 製作</p>
</main>
<script>
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var EMP = {
  '新人': [{ id: 'E1', n: '範例同仁乙' }, { id: 'E2', n: '範例同仁己' }],
  '回考核期': [{ id: 'E3', n: '範例同仁丙' }],
  '複檢': [{ id: 'E4', n: '範例同仁甲（改善單複檢）' }]
};
var R = [
  { id: 1, ts: '11-01 09:10', store: '範例門市一', mgr: '範例店長', type: '新人', emp: '範例同仁戊', days: ['2026-11-05', '2026-11-06'], video: true, note: '已完成報到與話術訓練', status: '已排定', reply: '11-05 14:00 線上考核' },
  { id: 2, ts: '10-28 16:40', store: '範例門市二', mgr: '範例店長二', type: '複檢', emp: '範例同仁庚', days: ['2026-11-03'], video: null, note: '改善單已輔導，申請複檢', status: '待處理', reply: '' }
];
var seq = 2, role = 'mgr', NOTICES = [{ text: '客服部已排定「範例同仁戊」11-05 14:00 線上考核，請同仁準時上線。', seen: false }];
function typeLabel(t) { return t === '新人' ? '新人考核' : t === '回考核期' ? '回考核期再考' : '改善單複檢'; }
function stTag(s) { return '<span class="tag ' + ({ '待處理': 'wait', '已排定': 'set', '已完成': 'done', '已取消': 'no' }[s]) + '">' + s + '</span>'; }
function dayInputs() { return [].slice.call($('mDays').querySelectorAll('input')); }
function addDay(v) {
  if (dayInputs().length >= 3) return;
  var w = document.createElement('div'); w.className = 'd';
  w.innerHTML = '<input class="ctrl" type="date" value="' + (v || '') + '"><button class="btn sm" type="button" data-rmday="1">移除</button>';
  $('mDays').appendChild(w); $('mAddDay').hidden = dayInputs().length >= 3;
}
function fillEmp() {
  $('videoRow').hidden = $('mType').value !== '新人'; $('mEmp').innerHTML = EMP[$('mType').value].map(function (e) { return '<option value="' + e.n + '">' + esc(e.n) + '</option>'; }).join(''); }
function pending(emp, type) { return R.some(function (r) { return r.emp === emp && r.type === type && (r.status === '待處理' || r.status === '已排定'); }); }
function daysCell(r) { return (r.days || []).map(function (x) { return '<span class="tag type" style="margin:0 4px 4px 0">' + x.slice(5) + '</span>'; }).join('') || '—'; }
function videoTag(r) { return r.type === '新人' ? (r.video ? '<span class="tag set">已看完影片</span>' : '<span class="tag no">未看完影片</span>') : ''; }
function render() {
  $('vMgr').hidden = role !== 'mgr'; $('vCs').hidden = role !== 'cs';
  [].forEach.call($('seg').children, function (b) { b.classList.toggle('on', b.dataset.r === role); });
  $('mgrNotice').innerHTML = NOTICES.map(function (n) { return '<div class="alert">' + esc(n.text) + '</div>'; }).join('');
  $('mBody').innerHTML = R.filter(function (r) { return r.store === '範例門市一'; }).map(function (r) {
    return '<tr><td>' + r.ts + '</td><td><span class="tag type">' + typeLabel(r.type) + '</span></td><td>' + esc(r.emp) + '</td><td>' + daysCell(r) + '</td><td>' + stTag(r.status) + '</td><td>' + esc(r.reply || '—') + '</td><td>' + (r.status === '待處理' ? '<button class="btn sm danger" data-cancel="' + r.id + '" type="button">撤回</button>' : '') + '</td></tr>';
  }).join('');
  var waiting = R.filter(function (r) { return r.status === '待處理'; }).length;
  $('csBadge').textContent = waiting; $('csBadge').hidden = !waiting;
  var fs = $('fStore').value, ft = $('fStatus').value;
  $('cBody').innerHTML = R.filter(function (r) { return (!fs || r.store === fs) && (!ft || r.status === ft); }).map(function (r) {
    var ops = r.status === '待處理' ? '<button class="btn sm" data-set="' + r.id + '" type="button">排定日期</button> <button class="btn sm danger" data-back="' + r.id + '" type="button">退回</button>'
      : r.status === '已排定' ? '<button class="btn sm primary" data-exam="' + r.id + '" type="button">開始考核</button>' : '';
    return '<tr><td>' + r.ts + '</td><td>' + esc(r.store) + '<div class="sub">' + esc(r.mgr) + '</div></td><td><span class="tag type">' + typeLabel(r.type) + '</span></td><td><b>' + esc(r.emp) + '</b><div style="margin-top:4px">' + videoTag(r) + '</div></td><td>' + daysCell(r) + '</td><td>' + esc(r.note || '—') + '</td><td>' + stTag(r.status) + (r.reply ? '<div class="sub">' + esc(r.reply) + '</div>' : '') + '</td><td>' + ops + '</td></tr>';
  }).join('');
  var last = R[R.length - 1], sch = R.filter(function (r) { return r.status === '已排定'; })[0];
  $('mailNew').innerHTML = '<b class="h">寄給：所有客服部帳號　｜　主旨：【待考回報】' + esc(last.store) + '　' + esc(last.emp) + '（' + typeLabel(last.type) + '）</b>' +
    esc(last.store) + '店長 ' + esc(last.mgr) + ' 回報：<b>' + esc(last.emp) + '</b>（' + typeLabel(last.type) + '）已準備好考核。<br>希望日期（最多 3 個）：' + ((last.days || []).map(function (x) { return x.slice(5); }).join('、') || '未填') + (last.type === '新人' ? '<br>線上回覆實戰全攻略影片：' + (last.video ? '已看完' : '未看完') : '') + '<br>備註：' + esc((last.note || '無').slice(0, 40)) + '<br><span class="sub">請登入系統查看並排定日期：</span> <u>https://（系統網址）/pending.html</u>';
  $('mailSet').innerHTML = sch ? '<b class="h">寄給：' + esc(sch.mgr) + '（' + esc(sch.store) + ' 店長）　｜　主旨：【已排定考核】' + esc(sch.emp) + '</b>客服部已排定 <b>' + esc(sch.emp) + '</b> 的線上考核：' + esc(sch.reply) + '。<br><span class="sub">請同仁準時上線。</span>' : '';
}
$('seg').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; role = b.dataset.r; render(); });
$('mType').addEventListener('change', fillEmp);
$('fStore').addEventListener('change', render); $('fStatus').addEventListener('change', render);
$('mGo').addEventListener('click', function () {
  var emp = $('mEmp').value, type = $('mType').value, log = $('mLog');
  log.className = 'log';
  if (!emp) { log.textContent = '請選擇人員。'; log.className = 'log err'; return; }
  if (pending(emp, type)) { log.textContent = emp + ' 已有未結案的回報（待處理或已排定），不能重複回報。'; log.className = 'log err'; return; }
  var days = dayInputs().map(function (i) { return i.value; }).filter(Boolean).filter(function (v, i, a) { return a.indexOf(v) === i; }).sort();
  if (!days.length) { log.textContent = '請至少選一個希望考核日期（最多 3 個）。'; log.className = 'log err'; return; }
  if (type === '新人' && !$('mVideo').checked) { log.textContent = '新人必須先看完「線上回覆實戰全攻略」影片，請勾選後再送出。'; log.className = 'log err'; return; }
  R.push({ id: ++seq, ts: '11-03 10:00', store: '範例門市一', mgr: '範例店長', type: type, emp: emp, days: days, video: type === '新人' ? true : null, note: $('mNote').value.trim(), status: '待處理', reply: '' });
  log.textContent = '已送出回報，客服部會收到系統通知與信件。'; $('mNote').value = ''; $('mVideo').checked = false; render();
});
$('mAddDay').addEventListener('click', function () { addDay(''); });
document.addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.rmday) { if (dayInputs().length > 1) { b.parentNode.remove(); $('mAddDay').hidden = false; } return; }
  var id = b.dataset.cancel || b.dataset.set || b.dataset.back || b.dataset.exam; if (!id) return;
  var r = R.filter(function (x) { return String(x.id) === id; })[0];
  if (b.dataset.cancel) { r.status = '已取消'; r.reply = '店長已撤回'; }
  else if (b.dataset.set) { var d = prompt('排定日期與時間（店長希望的日期：' + (r.days || []).map(function (x) { return x.slice(5); }).join('、') + '；例：11-06 14:00）'); if (!d) return; r.status = '已排定'; r.reply = d + ' 線上考核'; NOTICES.unshift({ text: '客服部已排定「' + r.emp + '」' + d + ' 線上考核，請同仁準時上線。' }); }
  else if (b.dataset.back) { var why = prompt('退回原因（必填）'); if (!why || !why.trim()) return; r.status = '已取消'; r.reply = '客服部退回：' + why.trim(); NOTICES.unshift({ text: '客服部退回「' + r.emp + '」的回報：' + why.trim() }); }
  else if (b.dataset.exam) { r.status = '已完成'; r.reply = (r.reply || '') + '（考核成績單送出後自動標記完成）'; }
  render();
});
var d0 = new Date('2026-11-03T09:00:00+08:00'); d0.setDate(d0.getDate() + 3); addDay(d0.toISOString().slice(0, 10));
fillEmp(); render();
</script>
</body>
</html>
