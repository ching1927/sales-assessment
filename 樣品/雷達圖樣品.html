<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雷達圖樣品（假資料）</title>
<style>/* 內嵌 tokens.css */
/* 公版 tokens（取自 2motor-design-system/assets/tokens.css，與樣品相同、未改值）＋兩頁共用的基礎樣式 */
:root{
  --glass-bg:rgba(255,255,255,0.62);
  --glass-bg-strong:rgba(255,255,255,0.80);
  --glass-blur:24px; --glass-sat:160%;
  --rim:rgba(255,255,255,0.9);
  --specular:inset 0 1px 1px rgba(255,255,255,0.9);
  --hairline:0 0 0 0.5px rgba(15,23,42,0.06);
  --shadow:0 8px 30px rgba(17,24,39,0.08);
  --shadow-lg:0 20px 60px rgba(17,24,39,0.16);
  --r-sm:10px; --r-ctrl:14px; --r-card:28px; --r-xl:34px; --r-pill:999px;
  --accent:#2F6BFF; --accent-soft:rgba(47,107,255,0.12); --accent-deep:#1E4FD0;
  --ink:#0F172A; --ink-2:#475569; --ink-3:#94A3B8; --ink-line:rgba(15,23,42,0.08);
  --success:#16A34A; --warning:#D97706; --danger:#DC2626; --info:#2F6BFF;
  --success-soft:rgba(22,163,74,0.12); --warning-soft:rgba(217,119,6,0.12);
  --danger-soft:rgba(220,38,38,0.10); --info-soft:rgba(47,107,255,0.12);
  --track:rgba(15,23,42,0.10);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang TC","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",monospace;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px; --sp-8:32px; --sp-12:48px; --sp-16:64px;
  --ease:cubic-bezier(.22,1,.36,1);
  --dur-in:600ms; --dur-micro:250ms;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font); color:var(--ink); min-height:100vh; overflow-x:hidden;
  background:
    radial-gradient(70% 50% at 80% 0%, rgba(120,150,255,0.10) 0%, transparent 60%),
    radial-gradient(60% 50% at 8% 100%, rgba(170,150,255,0.08) 0%, transparent 60%),
    linear-gradient(180deg,#F7F8FB 0%,#EEF1F6 100%);
  -webkit-font-smoothing:antialiased;
}
.glass{
  background:var(--glass-bg);
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  border:0.5px solid var(--rim);
  box-shadow:var(--specular),var(--hairline),var(--shadow);
  border-radius:var(--r-card); position:relative; overflow:hidden;
}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 26%)}
.glass > *{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.foot{text-align:center;color:var(--ink-3);font-size:12px}
[hidden]{display:none!important}
.notice{background:var(--warning-soft);color:var(--warning);font-weight:600;font-size:14px;line-height:1.5;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-ctrl)}
.notice.bad{background:var(--danger-soft);color:var(--danger)}

</style>
<style>/* 內嵌 app.css */
/* 貳輪嶼 CI 版面：黑・藍・黃・白（老闆指定，覆寫公版單一藍）＋共用導覽列與頁首橫幅。各頁在 tokens.css 之後載入。 */
:root{--ci-black:#0A0A0A;--ci-blue:#0669EB;--ci-yellow:#D9FF00;
  --accent:#0669EB;--accent-deep:#0553BC;--accent-soft:rgba(6,105,235,.12);--info:#0669EB;--info-soft:rgba(6,105,235,.12);
  --ink:#0A0A0A;--ink-2:#4A4F5A;--ab-h:64px}
body{background:radial-gradient(60% 40% at 90% 0%,rgba(6,105,235,.08),transparent 60%),radial-gradient(50% 40% at 0% 100%,rgba(217,255,0,.12),transparent 60%),linear-gradient(180deg,#FAFAFA 0%,#F0F2F5 100%)}

/* ===== 導覽列（黑底、全寬、固定在最上方） ===== */
.ab-bar{position:sticky;top:0;z-index:50;margin:calc(-1 * var(--sp-4)) calc(50% - 50vw) 0;background:var(--ci-black);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.ab-in{max-width:1320px;margin:0 auto;padding:0 var(--sp-4);height:64px;display:flex;align-items:center;gap:var(--sp-4)}
.ab-brand{display:flex;align-items:center;flex:none;text-decoration:none}
.ab-brand img{height:38px;width:auto;display:block}
.ab-tabs{display:flex;gap:2px;padding:4px;border-radius:var(--r-pill);background:rgba(255,255,255,.09);margin:0 auto;overflow-x:auto;scrollbar-width:none}
.ab-tabs::-webkit-scrollbar{display:none}
.ab-tab{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r-pill);font-size:14px;font-weight:600;
  color:rgba(255,255,255,.74);text-decoration:none;white-space:nowrap;
  transition:background var(--dur-micro) var(--ease),color var(--dur-micro) var(--ease)}
.ab-tab svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ab-tab:hover{color:#fff;background:rgba(255,255,255,.14)}
.ab-tab.on{background:var(--ci-yellow);color:var(--ci-black);box-shadow:0 2px 12px rgba(217,255,0,.35)}
.ab-tab[hidden]{display:none}
.ab-me{display:flex;align-items:center;gap:var(--sp-3);flex:none}
.ab-me-txt{line-height:1.3;text-align:right}
.ab-me-txt b{display:block;font-size:13px;color:#fff;font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ab-role{display:inline-block;padding:2px 9px;border-radius:var(--r-pill);background:var(--ci-yellow);color:var(--ci-black);font-size:12px;font-weight:700}
.ab-role:empty{display:none}
.ab-avatar{width:34px;height:34px;border-radius:50%;background:var(--ci-yellow);color:var(--ci-black);font-weight:700;font-size:14px;display:grid;place-items:center}
.ab-icon{width:36px;height:36px;border-radius:50%;border:0.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.10);color:#fff;
  display:grid;place-items:center;transition:background var(--dur-micro) var(--ease)}
.ab-icon:hover{background:rgba(255,255,255,.2)}
.ab-icon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:1340px){
  :root{--ab-h:116px}
  .ab-in{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:10px;row-gap:10px}
  .ab-me{margin-left:auto}
  .ab-tabs{order:3;width:100%;margin:0}
  .ab-me-txt{display:none}
}

/* ===== 頁首橫幅 ===== */
.ab-hero{position:relative;overflow:hidden;margin:var(--sp-6) 0 var(--sp-4);padding:var(--sp-6) var(--sp-8);border-radius:var(--r-card);
  background:linear-gradient(135deg,#0A0A0A 0%,#14171F 100%);color:#fff;box-shadow:var(--shadow)}

tr.weakrow td{background:var(--warning-soft)}

<body>
<main class="page">
  <section class="ab-hero"><div class="ab-crumb">樣品　/　雷達圖（假資料）</div><h1>成績單與考核後台的雷達圖</h1></section>

  <h2>① 成績單詳情：這張成績單的七面向（兩個題組平均）</h2>
  <section class="glass panel two">
    <div>
      <dl><dt>考生</dt><dd>範例同仁乙（新人）</dd><dt>總分</dt><dd>89.5（合格線 70 分）</dd><dt>判定</dt><dd>及格</dd><dt>最弱面向</dt><dd style="color:var(--warning)">主動引導</dd></dl>
      <span class="tag">基礎 D6</span> <span class="tag">進階 D7</span>
      <div class="note">雷達圖為這張成績單所有題組的平均；下方保留各題組的面向表格當明細。</div>
    </div>
    <div class="chartwrap" id="r1"></div>

  <h2>② 考核後台・人員歷史：七面向平均得分率</h2>
  <section class="glass panel two">
    <div class="chartwrap" id="r2"></div>
    <div>
      <table><thead><tr><th>面向</th><th class="num">平均得分率</th><th class="num">樣本數 n</th></tr></thead><tbody id="tb"></tbody></table>
      <div class="legend"><span><i style="background:var(--accent)"></i>得分率</span><span><i style="background:var(--warning)"></i>最弱面向</span></div>
      <div class="note">外圈 100%、環線 25／50／75；「—」代表該面向沒有資料（不適用不計入）。</div>
    </div>
  </section>
  <p class="foot">由 貳輪嶼 製作</p>

<script>/* 內嵌 js/radar.js */
/* 雷達圖（蜘蛛網圖）：多個放射狀軸線顯示各面向得分率。
   Radar.svg(rows, label)：rows = [{name, pct(0~100 或 null＝無資料), weak(是否最弱)}]，回傳 SVG 字串。 */
var Radar = (function () {
  var W = 460, H = 380, CX = 230, CY = 190, R = 118, RINGS = [25, 50, 75, 100];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmt(x) { return String(Math.round(Number(x) * 10) / 10); }
  function pt(i, n, r) {
    var a = -Math.PI / 2 + (2 * Math.PI * i) / n;
    return [CX + r * Math.cos(a), CY + r * Math.sin(a), a];
  }
  function poly(points) { return points.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '); }

  function svg(rows, label) {
    var n = rows.length, s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label) + '"><title>' + esc(label) + '</title>';
    if (n < 3) return s + '</svg>';
    // 同心環（25／50／75／100%）
    RINGS.forEach(function (g) {
      var ring = rows.map(function (_, i) { return pt(i, n, R * g / 100); });
      s += '<polygon points="' + poly(ring) + '" fill="' + (g === 100 ? 'var(--surface-solid, #fff)' : 'none') + '" stroke="var(--ink-line)" stroke-width="1"/>';
    });
    // 放射軸線
    rows.forEach(function (_, i) {
      var p = pt(i, n, R);
      s += '<line x1="' + CX + '" y1="' + CY + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" stroke="var(--ink-line)" stroke-width="1"/>';
    });
    // 環上刻度（沿正上方軸線）
    RINGS.forEach(function (g) {
      if (g === 100) return;
      s += '<text x="' + (CX + 4) + '" y="' + (CY - R * g / 100 + 11) + '" font-size="10" fill="var(--ink-3)">' + g + '</text>';
    });
    // 資料區塊（無資料的面向以 0 畫，標示「—」）
    var data = rows.map(function (r, i) { return pt(i, n, R * (r.pct === null ? 0 : Math.max(0, Math.min(100, r.pct))) / 100); });
    s += '<polygon points="' + poly(data) + '" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
    rows.forEach(function (r, i) {
      if (r.pct === null) return;
      s += '<circle cx="' + data[i][0].toFixed(1) + '" cy="' + data[i][1].toFixed(1) + '" r="' + (r.weak ? 5.5 : 4) + '" fill="' + (r.weak ? 'var(--warning)' : 'var(--accent)') + '" stroke="var(--surface-solid, #fff)" stroke-width="2"/>';
    });
    // 軸名稱與數值
    rows.forEach(function (r, i) {
      var p = pt(i, n, R + 16), c = Math.cos(p[2]);
      var anchor = Math.abs(c) < 0.2 ? 'middle' : (c > 0 ? 'start' : 'end');
      var dy = Math.sin(p[2]) > 0.5 ? 12 : (Math.sin(p[2]) < -0.5 ? -4 : 4);
      s += '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + dy).toFixed(1) + '" text-anchor="' + anchor + '" font-size="13" font-weight="600" fill="' + (r.weak ? 'var(--warning)' : 'var(--ink)') + '">' + esc(r.name) + '</text>' +
        '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + dy + 15).toFixed(1) + '" text-anchor="' + anchor + '" font-size="13" font-weight="700" fill="' + (r.weak ? 'var(--warning)' : 'var(--accent-deep)') + '">' + (r.pct === null ? '—' : fmt(r.pct) + '%') + '</text>';
    });
    return s + '</svg>';
  }

  return { svg: svg };
})();
if (typeof module !== 'undefined') module.exports = Radar;

</script>
