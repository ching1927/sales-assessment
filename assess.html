  });
  // 拖到附圖區以外的地方不要讓瀏覽器直接打開圖片
  document.addEventListener('dragover', function (e) { if (hasFiles(e)) e.preventDefault(); });
  document.addEventListener('drop', function (e) { if (hasFiles(e)) e.preventDefault(); });

  // ====== 資料載入與流程 ======
  function loadStep1() {
    // 待考回報只用來標記與排序；讀取失敗就照原樣，不擋考核
    var reqJob = AssessApi.openRequests().then(function (x) { return x; }, function () { return []; });
    return Promise.all([AssessApi.candidates(), AssessApi.myDrafts(email), reqJob]).then(function (r) {
      candidates = r[0].slice().sort(function (a, b) {
        return storeRank(a.store_code) - storeRank(b.store_code) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
      });
      reqMap = {};
      try {
        reqMap = RequestsCore.markReported(r[2]);
        candidates = RequestsCore.reportedFirst(candidates, reqMap, function (p) { return p.id; });
      } catch (e) { reqMap = {}; }
      drafts = r[1];
      if (expandId && !personById(expandId)) expandId = null;
    });
  }
  function toStep1() {
    S = fresh(); expandId = null; rowBusy = null; rowErr = {}; imgMsgs = []; resetSave();
    return loadStep1().then(function () { render(); }, function (e) { notice('err', errText(e)); render(); });
  }

  function itemFromDb(r) {
    return { id: r.id, cat: r.category, code: r.code, name: r.title, steps: normSteps(r.steps), levels: r.levels || {}, note: r.note || '', noteUrl: r.note_url || '', imgs: r.imgs || [], isExtra: !!r.isExtra };
  }
  function empFromDraft(a) {
    return { id: a.employee_id, label: a.employee_label, store: a.store_code, tenure: a.tenure, source: a.tenure_source };
  }
  // 載入一張草稿並回到對應步驟
  function openDraft(aid) {
    return AssessApi.loadDraft(aid).then(function (d) {
      S = fresh(); resetSave(); imgMsgs = [];
      S.aid = d.a.id; S.emp = empFromDraft(d.a); S.extraStart = d.a.extra_started_at || '';
      S.items = d.items.map(itemFromDb);
      if (S.items.length) { S.drawn = true; S.step = 3; S.cur = 0; }
      else { S.step = 2; }
      return d;
    });
  }
  // 抽題結果（assess_draw／assess_add_extra 共用格式）轉成前端題組物件；isExtra 為追加題
  function itemFromDraw(r, isExtra) {
    return { id: r.item_id, cat: r.category, code: r.code, name: r.title, steps: normSteps(r.steps), levels: {}, note: '', noteUrl: '', imgs: [], repeated: !!r.repeated, newRound: !!r.new_round, isExtra: !!isExtra };
  }
  // 固定核心題組：準備考核後自動用 assess_core_categories() 的分類一次抽齊（每分類 1 題）並直接進評分；
  // 抽不出來（例如題庫缺題）時停在抽題步驟，顯示錯誤並提供「改用自選分類」
  function autoDrawCore() {
    var aid = S.aid;
    S.coreFail = '';
    return AssessApi.coreCategories().then(function (cats) {
      if (!cats.length) throw AssessApi.userError('找不到核心分類設定，請聯絡管理人員。');
      return AssessApi.draw(aid, cats).then(function (rows) {
        if (S.aid !== aid) return;
        S.items = rows.map(function (r) { return itemFromDraw(r, false); });
        S.drawn = true; S.step = 3; S.cur = 0;
        if (S.items.some(function (x) { return x.repeated; })) notice('info', '有題組這位考生已考過（題庫裡沒考過的題組不夠了）。');
      }, function (err) {
        if (!/已抽過|最多一個題組/.test((err && err.userMessage) || '')) throw err;
        return openDraft(aid);   // 抽題其實成功但回應遺失、重試時被擋：重新載入草稿接續
      });
    }).catch(function (err) {
      if (S.aid !== aid) return;
      S.coreFail = errText(err) || '抽題失敗。'; S.step = 2; S.drawn = false;
    });
  }
  // 弱項追加題：選題、換題都允許與核心題組同分類
  var EX_OPTS = { allowSameCategory: true }, EX_DEFAULT = 2;
  // 核心題組評完後「分析弱項」：先把評分暫存完，再呼叫 assess_draft_weak；有弱項才載入題庫選建議追加題
  function analyzeWeak() {
    if (busy || !coreDone() || pendingReason()) return;
    var aid = S.aid, emp = S.emp, coreIds = coreItems().map(function (x) { return x.id; });
    run(function () {
      return uploadChain.then(flushAll).then(function (ok) {
        if (S.aid !== aid) return;
        if (!ok) throw AssessApi.userError('還有評分或備註沒有暫存成功，請看上方暫存提示，處理後再按一次。');
        return AssessApi.draftWeak(aid).then(function (profile) {
          if (S.aid !== aid) return;
          var weak = Suggest.weakOf(profile);
          S.weakInfo = { profile: profile, weak: weak, low: profile.always_low || [] };
          S.ex = null;
          if (!weak.length) { S.step = 5; return; }
          return Promise.all([AssessApi.suggestPool(emp.id), AssessApi.questionIdsOf(coreIds)]).then(function (r) {
            if (S.aid !== aid) return;
            var used = {}; r[1].forEach(function (id) { used[id] = 1; });
            var pool = r[0].filter(function (q) { return !used[q.question_id]; });   // 已在這場考核內的題組不能再追加
            var res = Suggest.pick(profile, pool, EX_DEFAULT, null, EX_OPTS);
            S.ex = { profile: profile, pool: pool, n: EX_DEFAULT, items: res.items, short: res.short, msg: '' };
            S.step = 5;
          }, function () {
            // 題庫或題組 id 讀不到：視為沒有可追加題組，仍可直接送出
            if (S.aid !== aid) return;
            S.ex = { profile: profile, pool: [], n: EX_DEFAULT, items: [], short: false, msg: '', unavailable: true };
            S.step = 5;
          });
        }, function (err) {
          // 弱項分析失敗：不卡住，可重試或略過直接送出
          if (S.aid !== aid) return;
          S.weakInfo = { failed: errText(err) || '弱項分析失敗。', weak: [], low: [] };
          S.ex = null; S.step = 5;
        });
      });
    });
  }

  function loadCats() {
    return AssessApi.categories().then(function (list) { S.catInfo = list; }, function (e) { S.catInfo = []; notice('err', errText(e)); });
  }

  function run(job) {
    if (busy) return;
    busy = true; notice('', ''); render();
    return job().then(function () { busy = false; render(); window.scrollTo(0, 0); },
      function (e) { busy = false; notice('err', errText(e)); render(); });
  }

  // 在該列按下「準備考核・去抽題」：assess_start → 載入草稿 → 進入抽題（已有草稿則接續）
  function startFor(p, override) {
    if (busy || rowBusy) return;
    var hadDraft = drafts.some(function (d) { return d.employee_id === p.id && d.kind !== 'checkup'; });   // 健檢草稿不算「先前未完成的考核」
    rowBusy = p.id; rowErr = {}; notice('', ''); render();
    AssessApi.start(p.id, p.hire_date ? null : override).then(function (aid) {
      return openDraft(aid).then(function () {
        if (S.step === 2) return autoDrawCore();
      }).then(function () {
        rowBusy = null; expandId = null;
        if (hadDraft) notice('info', '已接續先前未完成的考核');
        render(); window.scrollTo(0, 0);
      });
    }).catch(function (err) {
      rowBusy = null; rowErr = {}; rowErr[p.id] = errText(err);
      if (S.aid) { S = fresh(); }   // openDraft 若半途失敗，回到選考生
      render();
    });
  }
  // 健檢開始：checkup_begin（已有自己的草稿會回同一張）→ 載入草稿 → 抽固定核心題組並進評分；失敗停在可重試的面板
  function ckStart() {
    if (!CK || (ckPanel && ckPanel.kind === 'loading')) return;
    S = fresh(); resetSave(); imgMsgs = []; notice('', '');
    ckPanel = { kind: 'loading' }; render();
    var resumed = false;
    return AssessApi.checkupBegin(CK.emp, CK.year, CK.quarter).then(function (aid) {
      if (!aid) throw AssessApi.userError('沒有取得健檢草稿，請重試。');
      return openDraft(aid).then(function () {
        resumed = S.step === 3;
        if (S.step === 2) return autoDrawCore();
      });
    }).then(function () {
      ckPanel = null;
      if (resumed) notice('info', '已接續先前未完成的健檢');
      render(); window.scrollTo(0, 0);
    }, function (err) {
      S = fresh(); ckPanel = { kind: 'err', text: errText(err) || '無法開始健檢，請重試。' }; render();
    });
  }
  $('stage').addEventListener('change', function (e) {
    if (e.target && e.target.id === 'storeSel') { storeSel = e.target.value; saveStoreSel(); expandId = null; rowErr = {}; render(); }
    if (e.target && e.target.id === 'exN' && S.ex && !busy) {
      var g = S.ex, res = Suggest.pick(g.profile, g.pool, +e.target.value, null, EX_OPTS);
      g.n = +e.target.value; g.items = res.items; g.short = res.short; g.msg = ''; render();
    }
  });

  $('stage').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled || busy) return;
    var act = b.getAttribute('data-act');
    if (act === 'prep') {
      var pp = personById(b.dataset.id);
      if (!pp || rowBusy) return;
      rowErr = {};
      if (pp.hire_date) { startFor(pp, null); return; }
      expandId = expandId === pp.id ? null : pp.id;   // 到職日空白：就地展開／取消，同時只展開一列
    }
    else if (act === 'tenure2') {
      var pm = personById(b.dataset.id);
      if (!pm || rowBusy || pm.hire_date) return;
      startFor(pm, b.dataset.v);
      return;
    }
    else if (act === 'resume') {
      var rid = b.dataset.id;
      run(function () { return openDraft(rid).then(function () { if (S.step === 2) return autoDrawCore(); }); });
      return;
    }
    else if (act === 'dropdraft') { abandonTarget = b.dataset.id; $('dlg').showModal(); return; }
    else if (act === 'back2') { if (CK) { location.href = AssessCheckupCore.LIST_URL; return; } toStep1(); return; }
    else if (act === 'ckretry') { ckStart(); return; }
    else if (act === 'cat') {
      if (S.drawn) return;
      var i = S.cats.indexOf(b.dataset.cat); if (i >= 0) S.cats.splice(i, 1); else S.cats.push(b.dataset.cat);
    }
    else if (act === 'draw') {
      var order = S.catInfo.map(function (c) { return c.category; });
      var cats = S.cats.slice().sort(function (a, c) { return order.indexOf(a) - order.indexOf(c); });
      run(function () {
        var aid = S.aid;
        return AssessApi.draw(aid, cats).then(function (rows) {
          S.items = rows.map(function (r) {
            return { id: r.item_id, cat: r.category, code: r.code, name: r.title, steps: normSteps(r.steps), levels: {}, note: '', noteUrl: '', imgs: [], repeated: !!r.repeated, newRound: !!r.new_round };
          });
          S.drawn = true; S.cur = 0;
        }, function (err) {
          // 抽題其實成功但回應遺失、重試時被擋（已抽過）：重新載入草稿接續
          if (!/已抽過|最多一個題組/.test((err && err.userMessage) || '')) throw err;
          return openDraft(aid).then(function () {
            if (S.step === 2) return loadCats();
            notice('info', '這張考核已經抽過題，已重新載入並接續。');
          }, function () { throw err; });
        });
      });
      return;
    }
    else if (act === 'manual') { S.manual = true; if (!S.catInfo) { run(loadCats); return; } }
    else if (act === 'exswap') {
      var g = S.ex, si = +b.dataset.i;
      if (!g) return;
      var sn = Suggest.swap(g.profile, g.pool, g.items, si, null, EX_OPTS);
      if (sn) { g.items[si] = sn; g.msg = '已換題。'; } else g.msg = '沒有可換的題組了。';
    }
    else if (act === 'addextra') {
      var ex = S.ex;
      if (!ex || !ex.items.length) return;
      var qids = ex.items.map(function (x) { return x.question_id; }), xaid = S.aid;
      run(function () {
        return AssessApi.addExtra(xaid, qids).then(function (rows) {
          if (S.aid !== xaid) return;
          var first = S.items.length;
          rows.forEach(function (r) { S.items.push(itemFromDraw(r, true)); });
          S.ex = null; S.step = 3; S.cur = Math.min(first, S.items.length - 1); imgMsgs = [];
          notice('info', '已追加 ' + rows.length + ' 題追加題，請繼續評分；追加題不算入總分。');
          return AssessApi.extraStartedAt(xaid).then(function (t) { S.extraStart = t || new Date().toISOString(); }, function () { S.extraStart = new Date().toISOString(); });
        }, function (err) {
          // 追加其實成功但回應遺失、重試時被擋（題組已在這場考核內）：重新載入草稿（含追加題）接續
          if (!/已在這場考核內|已在這場|重複|已追加/.test((err && err.userMessage) || '')) throw err;
          return AssessApi.loadDraft(xaid).then(function (d) {   // 先確認資料庫裡真的有追加題，才動目前畫面狀態
            if (!d.items.some(function (x) { return x.isExtra; })) throw err;
            return openDraft(xaid).then(function () {
              var fi = -1; S.items.forEach(function (x, i) { if (x.isExtra && fi < 0) fi = i; });
              S.cur = Math.max(fi, 0); notice('info', '已重新載入追加題，請繼續評分；追加題不算入總分。');
            });
          }, function () { throw err; });
        });
      });
      return;
    }
    else if (act === 'skipextra') { submitReport(); return; }
    else if (act === 'retryweak') { analyzeWeak(); return; }
    else if (act === 'start3') { S.step = 3; S.cur = 0; }
    else if (act === 'tab') { S.cur = +b.dataset.i; imgMsgs = []; }
    else if (act === 'prevItem') { S.cur = Math.max(0, S.cur - 1); imgMsgs = []; }
    else if (act === 'nextItem') { S.cur = Math.min(S.items.length - 1, S.cur + 1); imgMsgs = []; }
    else if (act === 'lv') {
      var it = S.items[S.cur], dim = b.dataset.dim, lv = b.dataset.lv;
      if (lv === NA && it.levels[dim] !== NA && naCount(it) >= MAX_NA) return;
      it.levels[dim] = lv;
      markDirty(it);
    }
    else if (act === 'back3') S.step = 3;
    else if (act === 'submit') { submitReport(); return; }
    else if (act === 'again') { finished = null; notice('', ''); toStep1(); return; }
    render();
    if (act === 'start3') window.scrollTo(0, 0);
  });
  $('fixGo').addEventListener('click', function () {
    if (!canAdvance() || pendingReason() || busy) return;
    if (!CK && !extraItems().length) { analyzeWeak(); return; }   // 還沒追加：先分析弱項（健檢不分析弱項，直接結算）
    S.step = 4; render(); window.scrollTo(0, 0);
  });
  $('stage').addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'noteBox') { var it = S.items[+t.getAttribute('data-note')]; it.note = t.value; markDirty(it); }
    if (t.id === 'noteUrlBox') {
      var iu = S.items[+t.getAttribute('data-note')]; iu.noteUrl = t.value;
      var ue = noteUrlError(t.value), eb = $('noteUrlErr');
      eb.textContent = ue; eb.hidden = !ue;
      markDirty(iu);
    }
  });

  // ====== 放棄考核 ======
  var dlg = $('dlg');
  $('abandon').addEventListener('click', function () { abandonTarget = S.aid; dlg.showModal(); });
  $('dlgNo').addEventListener('click', function () { dlg.close(); abandonTarget = null; });
  $('dlgYes').addEventListener('click', function () {
    var aid = abandonTarget; dlg.close(); abandonTarget = null;
    if (!aid || busy) return;
    var isCurrent = aid === S.aid;
    busy = true; notice('', '');
    if (isCurrent) resetSave();   // 放棄後不再暫存這張
    AssessApi.abandon(aid).then(function (paths) {
      return AssessApi.removeFiles(paths).then(function (r) {
        return { paths: paths, ok: r.ok };
      });
    }).then(function (r) {
      busy = false;
      if (CK) {   // 健檢：放棄後排定仍保留，停在「已放棄」面板（可重新開始或回健檢名單）
        S = fresh(); imgMsgs = []; resetSave(); ckPanel = { kind: 'abandoned' }; render();
        if (r.paths.length && !r.ok) notice('warn', '健檢已放棄，但有圖片檔案沒能刪除，可能留有孤兒檔案，請通知管理人員清理。');
        else notice('ok', '已放棄這次健檢。');
        return;
      }
      return toStep1().then(function () {
        if (r.paths.length && !r.ok) notice('warn', '考核已放棄，但有圖片檔案沒能刪除，可能留有孤兒檔案，請通知管理人員清理。');
        else notice('ok', '已放棄這次考核。');
      });
    }, function (e) { busy = false; notice('err', errText(e)); render(); });
  });

  // ====== 送出成績單：以資料庫結果為準，與預覽比對 ======
  function sameWeak(a, b) { return (a || []).slice().sort().join('|') === (b || []).slice().sort().join('|'); }
  function submitReport() {
    var pre = Scoring.scoreAssessment(coreItems().map(function (i) { return i.levels; }), S.emp.tenure);
    if (!pre.ok || pendingReason()) return;
    if (!allDone()) { notice('err', '還有題組或追加題沒評完，不能送出。'); return; }
    var aid = S.aid, emp = S.emp, items = S.items.slice();
    busy = true; notice('', ''); render();
    uploadChain.then(flushAll).then(function (ok) {
      if (uploading > 0) throw AssessApi.userError('圖片上傳中，請稍候再送出。');
      if (!ok) throw AssessApi.userError('還有評分或備註沒有暫存成功，請看上方暫存提示，處理後再按一次送出。');
      return AssessApi.submit(aid);
    }).then(function (db) {
      if (!db) throw AssessApi.userError('送出後沒有收到結果，請到成績單確認是否已送出。');
      return AssessApi.loadItemScores(aid).then(function (rows) { return { db: db, rows: rows }; }, function () { return { db: db, rows: [] }; });
    }).then(function (r) {
      var db = r.db, mismatch = false;
      if (Math.abs(Number(db.total_score) - pre.total) > 0.001 || db.verdict !== pre.verdict || Number(db.pass_line) !== pre.passLine || !sameWeak(db.weakest_dims, pre.weakest)) mismatch = true;
      var byId = {}; r.rows.forEach(function (x) { byId[x.id] = x; });
      var ci = 0;   // 預覽只算核心題組；追加題不比對
      var rows = items.map(function (it) {
        var d = byId[it.id], ex = !!it.isExtra, pi = ex ? -1 : ci++;
        if (!d) { if (!ex) mismatch = true; return { code: it.code, levels: it.levels, item_score: null, dim_points: null, is_extra: ex }; }
        if (!ex && Math.abs(Number(d.item_score) - pre.itemScores[pi].score) > 0.001) mismatch = true;
        return d;
      });
      busy = false;
      var fin = finished = { db: db, rows: rows, emp: emp, aid: aid, mismatch: mismatch, next: null, after: null,
        weakTags: (S.weakInfo && items.some(function (x) { return x.isExtra; })) ? weakTags(S.weakInfo.weak) : '' };
      S = fresh(); resetSave(); imgMsgs = [];
      render(); window.scrollTo(0, 0);
      if (CK) return;   // 健檢：不讀待開通與考核期、不預告下次建議考題（健檢只記錄在建議單）
      // 通過（已加入待開通）或仍在考核期的說明：讀資料庫實際結果；讀不到就不顯示
      Promise.all([AssessApi.activationOf(aid).catch(function () { return null; }), AssessApi.periodStatus(emp.id).catch(function () { return null; })]).then(function (x) {
        if (finished !== fin) return;
        fin.after = { activation: x[0], period: x[1] }; render();
      });
      // 下次建議考題預告：失敗或沒有弱項就不顯示，不影響結果頁
      Promise.all([AssessApi.weakProfile(emp.id), AssessApi.suggestPool(emp.id)]).then(function (x) {
        var res = Suggest.pick(x[0], x[1], 3);
        if (res.empty || !res.items.length || finished !== fin) return;
        fin.next = res.items; render();
      }).catch(function () {});
    }, function (e) { busy = false; notice('err', errText(e)); render(); });
  }

  // ====== 啟動：登入、網域、開通、角色三道檢查 ======
  $('logout').addEventListener('click', doLogout);
  $('blockedLogout').addEventListener('click', doLogout);
  AssessApi.onSignedOut(function () { goLogin(''); });

  AssessApi.getSession().then(function (session) {
    if (!session) { goLogin(''); return; }
    email = (session.user && session.user.email) || '';
    if (!/@2motor\.tw$/i.test(email)) {
      AssessApi.signOut().then(function () { goLogin('domain'); });
      return;
    }
    $('whoEmail').textContent = email;
    return AssessApi.loadMe(email).then(function (row) {
      if (!row || !ROLE_LABEL[row.role]) { showBlocked('你的帳號尚未開通，請聯絡客服部。'); return; }
      if (CK && row.role !== 'cs_admin') {   // 健檢只有客服部能開始、評分；不呼叫任何寫入函式
        showBlocked('只有客服部可以進行健檢。', true);
        $('blockedGo').href = AssessCheckupCore.LIST_URL; $('blockedGo').textContent = '前往健檢名單';
        return;
      }
      if (row.role !== 'cs_admin') {
        showBlocked('只有客服部可以進行考核。即將帶你前往成績單。', true);
        setTimeout(function () { location.replace('reports.html'); }, 3000);
        return;
      }
      $('whoBadge').textContent = ROLE_LABEL[row.role];
      $('toAccounts').hidden = false; $('toQuestions').hidden = false;  // 只有客服部會走到這裡
      if (CK && !CK.ok) {   // 健檢網址參數缺漏或格式錯誤：白話錯誤＋回健檢名單
        showBlocked(CK.error, true);
        $('blockedGo').href = AssessCheckupCore.LIST_URL; $('blockedGo').textContent = '回健檢名單';
        return;
      }
      if (CK) {
        var ttl = AssessCheckupCore.titleOf(CK.year, CK.quarter);
        document.title = '業務考核系統｜' + ttl;
        $('heroCrumb').textContent = '考核　/　健檢'; $('heroTitle').textContent = ttl;
        $('ckInfo').textContent = ttl + '：考法與一般考核相同，身分固定「正式」，及格線 ' + AssessCheckupCore.PASS_LINE + ' 分。健檢結果只記錄在建議單。';
        $('ckInfo').hidden = false;
        document.querySelector('#dlg h2').textContent = '放棄這次健檢？';
        document.querySelector('#dlg p').textContent = '放棄後，這位同仁這次的評分、備註與附圖都會刪除，已抽出的題組不算已抽過，會回到題池；健檢的排定仍然保留，可以重新開始。此動作無法復原。';
        return AssessApi.loadStores().then(function (list) {
          list.forEach(function (s) { storeName[s.code] = s.name; });
          $('loading').hidden = true; $('app').hidden = false;
          return ckStart();
        });
      }
      return AssessApi.loadStores().then(function (list) {
        list.forEach(function (s) { storeName[s.code] = s.name; });
        return loadStep1();
      }).then(function () {
        $('loading').hidden = true; $('app').hidden = false;
        render();
      });
    });
  }).catch(function (e) {
    showBlocked(errText(e) || '載入失敗，請重新整理頁面。');
  });
})();
</script>
<script src="js/appbar.js"></script>
</body>
</html>
