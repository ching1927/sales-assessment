<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>貳輪嶼官方LINE訊息回覆人員名冊</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<style>
select,input{font-family:inherit;font-size:14px;color:var(--ink)}
.page{max-width:1100px;margin:0 auto;padding:var(--sp-4)}
.top{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center;justify-content:space-between;margin:var(--sp-2) 0 var(--sp-4)}
.top h1{font-size:22px;font-weight:700}
.who{display:flex;flex-wrap:wrap;gap:var(--sp-3) var(--sp-4);align-items:center;font-size:13px;color:var(--ink-2)}
.who-id,.who-nav{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center}
.who-nav{padding-left:var(--sp-4);border-left:1px solid var(--ink-line)}
.who .badge{background:rgba(15,23,42,.06);color:var(--ink);border:1px solid var(--ink-line);font-weight:600;padding:4px 12px;border-radius:var(--r-ctrl);font-size:13px}
@media (max-width:640px){.who-nav{flex-basis:100%;padding-left:0;border-left:none}}
.ctrl{padding:9px 12px;border-radius:var(--r-ctrl);border:0.5px solid var(--ink-line);background:var(--glass-bg-strong);min-height:40px;font-size:16px}
.btn{padding:9px 16px;min-height:40px;border-radius:var(--r-ctrl);border:0.5px solid var(--rim);background:var(--glass-bg-strong);color:var(--ink);
  font-size:14px;font-weight:600;box-shadow:var(--specular),var(--hairline);transition:transform var(--dur-micro) var(--ease)}
.btn:hover{transform:translateY(-1px)}
.btn[disabled]{opacity:.6;cursor:default;transform:none}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-deep)}
.btn.sm{padding:5px 12px;min-height:32px;font-size:13px}
.link{background:none;border:none;color:var(--accent);font-weight:600;font-size:13px;padding:6px 4px}
#logout{color:var(--ink-2)}
.nav{display:inline-block;background:var(--accent-soft);color:var(--accent-deep);font-weight:700;font-size:15px;padding:8px 16px;border-radius:var(--r-pill);text-decoration:none}
.nav.primary{background:var(--accent);color:#fff}
.nav:hover{filter:brightness(.96)}
.nav[hidden]{display:none}
.msg{margin-bottom:var(--sp-4)}
.toolbar{padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-4);display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center}
.toolbar .grow{flex:1 1 180px;min-width:140px}
.count{margin-left:auto;color:var(--ink-2);font-size:13px}
.tablebox{padding:0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:960px;border-collapse:collapse;font-size:14px}
th,td{padding:12px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--ink-line)}
th{font-size:12px;color:var(--ink-2);font-weight:600;background:rgba(255,255,255,0.8)}
tbody tr:last-child td{border-bottom:none}
tr.off td{color:var(--ink-3)}
.mono{font-family:var(--mono)}
.sub2{color:var(--ink-3);font-size:12px;margin-left:6px}
.namelink{color:inherit;font-weight:600;text-decoration:none}
.namelink:hover{color:var(--accent-deep);text-decoration:underline}
.tag{display:inline-block;padding:3px 10px;border-radius:var(--r-pill);font-size:12px;font-weight:600}
.tag.new{background:var(--info-soft);color:var(--accent-deep)}
.tag.reg{background:var(--track);color:var(--ink-2)}
.tag.unk{background:var(--warning-soft);color:var(--warning)}
.tag.on{background:var(--success-soft);color:var(--success)}
.tag.out{background:var(--danger-soft);color:var(--danger)}
.tag.period{background:var(--ci-black);color:var(--ci-yellow)}
.tag.tech{background:rgba(245,184,0,.18);color:#8a6500}
.tag.dev{background:#e2e8f0;color:#334155}
td.linecell{white-space:normal;min-width:240px}
/* 操作欄固定在右側，表格太寬時不用左右拖就按得到 */
th.ops,td.ops{position:sticky;right:0;background:#fff;box-shadow:-8px 0 8px -8px rgba(15,23,42,.18)}
.chip{display:inline-block;padding:1px 9px;margin:1px 3px 1px 0;border-radius:var(--r-pill);font-size:12px;font-weight:600;background:#fff;color:#1F3A5F;box-shadow:inset 0 0 0 1px #1F3A5F}
.chip.all{background:var(--ink);color:#fff}
.lines{border:0.5px solid var(--ink-line);border-radius:var(--r-ctrl);padding:var(--sp-3);margin:0 0 var(--sp-3);background:var(--glass-bg-strong)}
.lines legend{font-size:13px;color:var(--ink-2);font-weight:600;padding:0 6px}
.lines .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2)}
.lines label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);font-weight:400}
.lines input{width:auto;margin:0}
.lines[hidden]{display:none}
.empty{padding:var(--sp-8);text-align:center;color:var(--ink-2)}
.sw{position:relative;width:46px;height:28px;border-radius:var(--r-pill);border:none;background:var(--track);transition:background var(--dur-micro) var(--ease);vertical-align:middle}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(15,23,42,.25);transition:transform var(--dur-micro) var(--ease)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.yn{margin-left:8px;font-size:13px;color:var(--ink-2)}
dialog{border:none;border-radius:var(--r-card);padding:0;max-width:440px;width:calc(100% - 32px);box-shadow:var(--shadow-lg);background:var(--glass-bg-strong);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));margin:auto;color:var(--ink)}
dialog::backdrop{background:rgba(15,23,42,0.30)}
.dlg{padding:var(--sp-6);max-height:90vh;overflow-y:auto}
.dlg h2{font-size:18px;margin-bottom:var(--sp-4)}
.field{display:block;margin-bottom:var(--sp-3);font-size:13px;color:var(--ink-2);font-weight:600}
.field input,.field select{display:block;width:100%;margin-top:6px;font-weight:400}
.field[hidden]{display:none}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:var(--sp-2)}
.actions{display:flex;gap:var(--sp-2);justify-content:flex-end;margin-top:var(--sp-2)}
.note{color:var(--ink-3);font-size:12px;margin-top:var(--sp-3)}
.foot{margin:var(--sp-6) 0 var(--sp-4)}
.loading{padding:var(--sp-12) var(--sp-4);text-align:center;color:var(--ink-2)}
.blocked{max-width:420px;margin:var(--sp-12) auto 0;padding:var(--sp-8) var(--sp-6);text-align:center}
.blocked p{font-size:15px;line-height:1.6;margin-bottom:var(--sp-4)}
@media (max-width:480px){
  .top h1{font-size:19px}
  .toolbar .ctrl{flex:1 1 100%}
  .count{margin-left:0}
}
</style>
</head>
<body>
<div class="page">
  <div class="loading" id="loading" role="status">載入中…</div>

  <section class="blocked glass" id="blocked" hidden>
    <p id="blockedText"></p>
    <button class="btn" id="blockedLogout" type="button">登出</button>
  </section>

  <div id="app" hidden>
    <header class="ab-bar">
      <div class="ab-in">
        <a class="ab-brand" href="roster.html" aria-label="貳輪嶼 MOTOR ISLAND"><img src="img/logo-white.png" alt="貳輪嶼 MOTOR ISLAND"></a>
        <nav class="ab-tabs" aria-label="主要功能">
        <a class="ab-tab on" href="roster.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>人員名冊</a>
        <a class="ab-tab" id="toAssess" hidden href="assess.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>進行考核</a>
        <a class="ab-tab" href="backoffice.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>成績單&amp;考核後台</a>
        <a class="ab-tab" href="requests.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>待考回報</a>
        <a class="ab-tab" href="checkup.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></svg>健檢</a>
        <a class="ab-tab" id="toQuestions" hidden href="questions.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>題庫管理</a>
        <a class="ab-tab" id="toAccounts" hidden href="accounts.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>帳號管理</a>
        </nav>
        <div class="ab-me">
          <div class="ab-me-txt"><b id="whoEmail"></b><span class="ab-role" id="whoBadge"></span></div>
          <div class="ab-avatar" id="whoAvatar" aria-hidden="true"></div>
          <button class="ab-icon" id="logout" type="button" aria-label="登出" title="登出"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></button>
        </div>
      </div>
    </header>
    <section class="ab-hero">
      <div class="ab-crumb">管理　/　人員名冊</div>
      <h1>貳輪嶼官方LINE訊息回覆人員名冊</h1>
    </section>

    <div class="notice bad msg" id="msg" role="alert" hidden></div>

    <section class="toolbar glass" aria-label="篩選">
      <select class="ctrl" id="storeFilter" aria-label="門市篩選"></select>
      <select class="ctrl" id="catFilter" aria-label="類別篩選"></select>
      <select class="ctrl" id="lineFilter" aria-label="官方 LINE 篩選"></select>
      <select class="ctrl" id="statusFilter" aria-label="在職狀態篩選"><option value="在職">在職</option><option value="">含離職</option></select>
      <input class="ctrl grow" id="search" type="search" placeholder="搜尋編號、姓名或暱稱" aria-label="搜尋">
      <button class="btn primary" id="addBtn" type="button" hidden>新增人員</button>
      <span class="count" id="count" aria-live="polite"></span>
    </section>

    <section class="tablebox glass">
      <div class="scroll" tabindex="0" aria-label="人員名冊表格，可左右捲動">
        <table>
          <thead>
            <tr>
              <th>員工編號</th><th>姓名／暱稱</th><th>門市</th><th>職級</th>
              <th>身分標籤</th><th>在職狀態</th><th>納入考核</th><th>官方 LINE 回覆權限</th><th id="thOps" class="ops" hidden>操作</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" hidden>沒有符合條件的人員</div>
    </section>
    <p class="note">考核期＝尚未通過考核（新人合格線 70 分），不能回覆顧客；新人由系統依到職日自動計算，到職起 90 天內顯示，只是方便辨認；其餘為已上線。到職日沒填的另顯示「未填到職日」。</p>
  </div>
  <p class="foot">由 貳輪嶼 製作</p>
</div>

<dialog id="dlg">
  <form class="dlg" id="form" method="dialog" novalidate>
    <h2 id="dlgTitle"></h2>
    <label class="field">員工編號（MI-xxxx，工讀為 PT-xxxx，公務機為 OF-xxxx）
      <input class="ctrl" id="fId" autocomplete="off" placeholder="例：MI-0123">
    </label>
    <label class="field">暱稱
      <input class="ctrl" id="fNick" autocomplete="off">
    </label>
    <label class="field">姓名（暱稱與姓名至少填一個）
      <input class="ctrl" id="fFull" autocomplete="off">
    </label>
    <label class="field">門市
      <select class="ctrl" id="fStore"></select>
    </label>
    <label class="field">職級
      <select class="ctrl" id="fPos"></select>
    </label>
    <label class="field" id="fPosOtherWrap" hidden>請輸入職級（最多 20 字）
      <input class="ctrl" id="fPosOther" maxlength="20" autocomplete="off" placeholder="例：營運經理">
    </label>
    <div id="fPosHint" style="margin:-4px 0 var(--sp-3);font-size:13px;color:var(--accent-deep);font-weight:600" hidden></div>
    <label class="field">到職日（可留空，之後補填）
      <input class="ctrl" id="fHire" type="date">
    </label>
    <label class="field">在職狀態
      <select class="ctrl" id="fStatus"><option>在職</option><option>離職</option></select>
    </label>
    <label class="field">納入考核
      <select class="ctrl" id="fInc"><option value="1">是</option><option value="0">否</option></select>
    </label>
    <label class="field" id="fPeriodWrap" hidden>回覆狀態（考核期不能回覆顧客；通過考核會自動轉已上線，特殊情況可手動調整）
      <select class="ctrl" id="fPeriod"><option value="考核期">考核期</option><option value="已上線">已上線</option></select>
    </label>
    <fieldset class="lines" id="fLines" hidden>
      <legend>官方 LINE 回覆權限</legend>
      <div class="grid" id="fLinesGrid"></div>
    </fieldset>
    <div class="err" id="fErr" role="alert"></div>
    <div class="actions">
      <button class="btn" type="button" id="fCancel">取消</button>
      <button class="btn primary" type="submit" id="fSave">儲存</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/line-core.js"></script>
<script src="js/api.js"></script>
<script>
(function () {
  var OTHER = '__other';
  var POSITIONS = ['店長', '業務', '收車業務', '業務/助理', '助理', '工讀', '技師', '公務機'];
  var DEFAULT_INC = { '業務': true, '收車業務': true, '業務/助理': true, '店長': false, '助理': false, '工讀': false, '技師': false, '公務機': false };
  var ROLE_LABEL = { cs_admin: '客服部', hq_viewer: '總公司主管', store_manager: '店長' };
  var TAG = { '新人': 'new', '正式': 'reg', '未填到職日': 'unk' };
  var ID_RE = /^(MI|PT|OF)-[0-9]{4}$/;

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var me = null;        // app_users 那一列
  var stores = [];      // [{code,name}]
  var people = [];
  var lines = [];       // 官方 LINE 帳號 [{code,name,sort_order}]
  var access = {};      // { 員編: [line_code] }
  var lineOk = false;   // LINE 權限資料是否讀取成功（失敗時不顯示、也不允許改，避免存檔時蓋掉）
  var storeName = {};
  var busy = false;
  var editingId = null;

  function isCS() { return !!me && me.role === 'cs_admin'; }
  function isManager() { return !!me && me.role === 'store_manager'; }

  function showMsg(t) { var m = $('msg'); m.textContent = t; m.hidden = !t; }
  function goLogin(reason) { location.replace('index.html' + (reason ? '?reason=' + reason : '')); }
  function doLogout() { Api.signOut().then(function () { goLogin(''); }); }

  function showBlocked(text) {
    $('loading').hidden = true;
    $('app').hidden = true;
    $('blockedText').textContent = text;
    $('blocked').hidden = false;
  }

  // 身分標籤（規格 README_phase1.md 第一節第 2 點）：考核期者顯示「考核期」；到職 90 天內另顯示「新人」（只是辨認用）；其他顯示「已上線」。
  // 沒填到職日者另加「未填到職日」。只看 period_status（資料庫遷移與 spot_register 回考核期都會同步），不再看 probation_since。period_status 來自 employees_with_tenure，tenure_group 為資料庫判斷的新人／正式
  function statusTags(p) {
    var period = p.period_status === '考核期', fresh = p.tenure_group === '新人', h = [];
    if (period) h.push('<span class="tag period">考核期</span>');
    if (fresh) h.push('<span class="tag new">新人</span>');
    if (!period && !fresh) h.push('<span class="tag reg">已上線</span>');
    if (!p.hire_date) h.push('<span class="tag unk">未填到職日</span>');
    return h.join(' ');
  }

  function nameCell(p) {
    var nick = (p.nickname || '').trim(), full = (p.full_name || '').trim();
    var inner = nick && full ? esc(nick) + '<span class="sub2">' + esc(full) + '</span>' : esc(nick || full || p.id);
    // 點姓名／暱稱直接到考核後台看這位同仁的歷史成績（後台依角色過濾：店長只看得到自己門市）
    return '<a class="namelink" href="backoffice.html?emp=' + encodeURIComponent(p.id) + '#history" title="查看考核歷史">' + inner + '</a>';
  }

  function fillSelect(sel, items, firstAll) {
    sel.innerHTML = (firstAll ? '<option value="">全部門市</option>' : '') +
      items.map(function (s) { return '<option value="' + esc(s.code) + '">' + esc(s.name) + '</option>'; }).join('');
  }

  function titleCell(title) {
    var c = LineCore.titleClass(title);
    return c ? '<span class="tag ' + c + '">' + esc(title) + '</span>' : esc(title);
  }

  // 官方 LINE 回覆權限欄：全部都有＝黑底「全部 N 個 LINE」；部分＝一個個標籤；沒有＝—
  function lineCell(id) {
    if (!lineOk) return '<span class="yn">—</span>';
    var s = LineCore.lineSummary(access[id] || [], lines);
    if (s.kind === 'all') return '<span class="chip all">全部 ' + lines.length + ' 個 LINE</span>';
    if (s.kind === 'none') return '<span class="yn">—</span>';
    return s.items.map(function (x) { return '<span class="chip">' + esc(x.name) + '</span>'; }).join('');
  }

  function render() {
    var f = {
      store: isManager() ? '' : $('storeFilter').value,
      q: $('search').value,
      category: $('catFilter').value,
      line: $('lineFilter').value,
      status: $('statusFilter').value
    };
    var cs = isCS();
    var rows = people.filter(function (p) { return LineCore.matchRow(p, f, access[p.id] || []); });
    $('tbody').innerHTML = rows.map(function (p) {
      var tg = p.tenure_group;
      var inc = cs
        ? '<button type="button" class="sw" role="switch" aria-checked="' + (p.include_in_assessment ? 'true' : 'false') + '" aria-label="納入考核：' + esc(p.nickname || p.full_name || p.id) + '" data-toggle="' + esc(p.id) + '"></button><span class="yn">' + esc(LineCore.assessText(p)) + '</span>'
        : esc(LineCore.assessText(p));
      return '<tr class="' + (p.status === '離職' ? 'off' : '') + '">' +
        '<td class="mono">' + esc(p.id) + '</td>' +
        '<td>' + nameCell(p) + '</td>' +
        '<td>' + esc(storeName[p.store_code] || p.store_code) + '</td>' +
        '<td>' + titleCell(p.job_title) + '</td>' +
        '<td>' + statusTags(p) + '</td>' +
        '<td><span class="tag ' + (p.status === '在職' ? 'on' : 'out') + '">' + esc(p.status) + '</span></td>' +
        '<td>' + inc + '</td>' +
        '<td class="linecell">' + lineCell(p.id) + '</td>' +
        (cs ? '<td class="ops"><button type="button" class="btn sm" data-edit="' + esc(p.id) + '">編輯</button></td>' : '') +
        '</tr>';
    }).join('');
    $('empty').hidden = rows.length > 0;
    $('count').textContent = '共 ' + rows.length + ' 人';
  }

  function reload() {
    // LINE 權限讀取失敗不影響名冊其他功能：該欄顯示「—」並提示，且不開放修改
    var lineLoad = Promise.all([Api.loadLineAccounts(), Api.loadLineAccess()]).then(function (r) {
      lines = r[0]; access = LineCore.groupAccess(r[1]); lineOk = true;
    }, function () {
      lines = []; access = {}; lineOk = false;
      showMsg('官方 LINE 回覆權限讀取失敗（其他欄位正常），請重新整理頁面；若持續發生請聯絡客服部。');
    });
    return Promise.all([Api.loadStores(), Api.loadEmployees(), lineLoad]).then(function (r) {
      stores = r[0]; people = r[1];
      var curLine = $('lineFilter').value;
      $('lineFilter').innerHTML = '<option value="">全部 LINE</option>' + lines.map(function (l) {
        return '<option value="' + esc(l.code) + '">' + esc(l.name) + '</option>';
      }).join('');
      if (lines.some(function (l) { return l.code === curLine; })) $('lineFilter').value = curLine;
      $('lineFilter').hidden = !lineOk;
      storeName = {};
      stores.forEach(function (s) { storeName[s.code] = s.name; });
      var cur = $('storeFilter').value;
      fillSelect($('storeFilter'), stores, true);
      if (storeName[cur]) $('storeFilter').value = cur;
      fillSelect($('fStore'), stores, false);
      $('fStore').insertAdjacentHTML('afterbegin', '<option value="">請選擇門市</option>');
      render();
    });
  }

  function applyUI() {
    var label = ROLE_LABEL[me.role] || '';
    if (isManager()) label += '・' + (storeName[me.store_code] || me.store_code || '');
    $('whoBadge').textContent = label;
    $('storeFilter').hidden = isManager();
    $('catFilter').innerHTML = '<option value="">全部類別</option>' + LineCore.categoryOptions().map(function (c) {
      return '<option>' + esc(c) + '</option>';
    }).join('');
    $('toAssess').hidden = !isCS();
    $('toAccounts').hidden = !isCS();
    $('toQuestions').hidden = !isCS();
    $('addBtn').hidden = !isCS();
    $('thOps').hidden = !isCS();
    $('fPos').innerHTML = POSITIONS.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') +
      '<option value="' + OTHER + '">其他（自行輸入）</option>';
  }

  function start() {
    Api.getSession().then(function (session) {
      if (!session) { goLogin(''); return; }
      var email = (session.user && session.user.email) || '';
      if (!/@2motor\.tw$/i.test(email)) {
        Api.signOut().then(function () { goLogin('domain'); });
        return;
      }
      $('whoEmail').textContent = email;
      return Api.loadMe(email).then(function (row) {
        if (!row || !ROLE_LABEL[row.role]) { showBlocked('你的帳號尚未開通，請聯絡客服部。'); return; }
        me = row;
        return reload().then(function () {
          applyUI();
          render();
          $('loading').hidden = true;
          $('app').hidden = false;
        });
      });
    }).catch(function (e) {
      showBlocked((e && e.userMessage) || '載入失敗，請重新整理頁面。');
    });
  }

  // 篩選、搜尋、登出
  $('storeFilter').addEventListener('change', render);
  $('search').addEventListener('input', render);
  ['catFilter', 'lineFilter', 'statusFilter'].forEach(function (id) { $(id).addEventListener('change', render); });
  $('logout').addEventListener('click', doLogout);
  $('blockedLogout').addEventListener('click', doLogout);
  Api.onSignedOut(function () { goLogin(''); });

  // 納入考核開關與編輯（只有客服部看得到控制項；事件也再擋一次）
  $('tbody').addEventListener('click', function (e) {
    if (!isCS()) return;
    var t = e.target.closest('[data-toggle]');
    if (t) {
      if (busy) return;
      var p = people.filter(function (x) { return x.id === t.dataset.toggle; })[0];
      if (!p) return;
      busy = true; showMsg('');
      Api.updateEmployee(p.id, { include_in_assessment: !p.include_in_assessment })
        .then(reload)
        .catch(function (err) { showMsg(err.userMessage || Api.explain(err)); return reload().catch(function () {}); })
        .then(function () { busy = false; });
      return;
    }
    var ed = e.target.closest('[data-edit]');
    if (ed) openForm(ed.dataset.edit);
  });
  $('addBtn').addEventListener('click', function () { if (isCS()) openForm(null); });

  // 表單
  var dlg = $('dlg');
  function syncPosOther() {
    $('fPosOtherWrap').hidden = $('fPos').value !== OTHER;
    $('fPosHint').hidden = true;
  }
  // 輸入的文字恰好是標準職級：提示並套用其納入考核預設（新增時）
  // 只在失焦與送出時判斷，打字過程不自動切換
  function applyStdPos() {
    if ($('fPos').value !== OTHER) return;
    var v = $('fPosOther').value.trim();
    if (POSITIONS.indexOf(v) < 0) return;
    $('fPos').value = v;                 // 下拉切回標準選項，輸入框收起（提示保留）
    $('fPosOtherWrap').hidden = true;
    $('fPosOther').value = '';
    $('fPosHint').textContent = '已改用標準職級：' + v;
    $('fPosHint').hidden = false;
    syncAddDefaults(v);
  }
  // 新增時，換職級會帶出預設的「納入考核」與「回覆狀態」（技師、公務機＝不納入、已上線）；編輯時不自動改
  function syncAddDefaults(pos) {
    if (editingId) return;
    $('fInc').value = DEFAULT_INC[pos] ? '1' : '0';
    $('fPeriod').value = LineCore.defaultPeriod(pos);
  }
  $('fPosOther').addEventListener('blur', applyStdPos);
  function openForm(id) {
    editingId = id;
    $('fErr').textContent = '';
    $('dlgTitle').textContent = id ? '編輯人員' : '新增人員';
    var p = id ? people.filter(function (x) { return x.id === id; })[0] : null;
    if (id && !p) return;
    $('fId').value = p ? p.id : '';
    $('fId').disabled = !!p;
    $('fNick').value = p ? (p.nickname || '') : '';
    $('fFull').value = p ? (p.full_name || '') : '';
    $('fStore').value = p ? p.store_code : '';
    if (p && POSITIONS.indexOf(p.job_title) < 0) { $('fPos').value = OTHER; $('fPosOther').value = p.job_title; }
    else { $('fPos').value = p ? p.job_title : POSITIONS[1]; $('fPosOther').value = ''; }
    syncPosOther();
    $('fHire').value = p ? (p.hire_date || '') : '';
    $('fStatus').value = p ? p.status : '在職';
    $('fInc').value = (p ? p.include_in_assessment : !!DEFAULT_INC[$('fPos').value]) ? '1' : '0';
    // 回覆狀態：只有客服部看得到；新增預設考核期，編輯顯示目前值（資料庫預設是已上線，所以新增一定要明確帶）
    $('fPeriodWrap').hidden = !isCS();
    $('fPeriod').value = p ? (p.period_status === '考核期' ? '考核期' : '已上線') : LineCore.defaultPeriod($('fPos').value);
    // 官方 LINE 回覆權限：只有客服部、且資料讀取成功才顯示勾選框
    $('fLines').hidden = !(isCS() && lineOk);
    var have = (p && access[p.id]) || [];
    $('fLinesGrid').innerHTML = lines.map(function (l) {
      return '<label><input type="checkbox" name="fLine" value="' + esc(l.code) + '"' + (have.indexOf(l.code) >= 0 ? ' checked' : '') + '>' + esc(l.name) + '</label>';
    }).join('');
    dlg.showModal();
  }
  // 新增時，換職級會帶出預設的納入考核（編輯時不自動改，避免蓋掉逐人調整）
  $('fPos').addEventListener('change', function () {
    syncPosOther();
    syncAddDefaults(this.value);
  });
  $('fCancel').addEventListener('click', function () { dlg.close(); });
  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!isCS()) { dlg.close(); return; }
    if (busy) return;
    var id = $('fId').value.trim().toUpperCase();
    var nick = $('fNick').value.trim();
    var full = $('fFull').value.trim();
    var err = '';
    if (!editingId) {
      if (!ID_RE.test(id)) err = '員工編號格式為 MI-0000（工讀為 PT-0000，公務機為 OF-0000）';
      else if (people.some(function (x) { return x.id === id; })) err = '這個員工編號已存在';
    }
    if (!err && !nick && !full) err = '暱稱與姓名至少要填一個';
    if (!err && !$('fStore').value) err = '請選擇門市';
    applyStdPos();
    var pos = $('fPos').value;
    if (pos === OTHER) {
      pos = $('fPosOther').value.trim();
      if (POSITIONS.indexOf(pos) >= 0) { if (!editingId) $('fInc').value = DEFAULT_INC[pos] ? '1' : '0'; }
      else if (!err && !pos) err = '請輸入職級（不可空白）';
      else if (!err && pos.length > 20) err = '職級最多 20 字';
    }
    if (err) { $('fErr').textContent = err; return; }
    var data = {
      nickname: nick || null, full_name: full || null, store_code: $('fStore').value,
      job_title: pos, hire_date: $('fHire').value || null,
      status: $('fStatus').value, include_in_assessment: $('fInc').value === '1'
    };
    if (isCS()) data.period_status = $('fPeriod').value;
    busy = true; $('fSave').disabled = true; $('fErr').textContent = '';
    var job, empId = editingId || id;
    if (editingId) job = Api.updateEmployee(editingId, data);
    else { data.id = id; job = Api.insertEmployee(data); }
    var saved = false;   // 人員資料已寫入（之後若 LINE 權限失敗，要重新整理畫面，且再按儲存視為編輯）
    job.then(function () {
      saved = true;
      if (!(lineOk && !$('fLines').hidden)) return;
      var want = Array.prototype.map.call(document.querySelectorAll('#fLinesGrid input:checked'), function (x) { return x.value; });
      var had = access[empId] || [];
      if (want.length === had.length && want.every(function (c) { return had.indexOf(c) >= 0; })) return;   // 沒變就不寫
      return Api.setLineAccess(empId, want).catch(function (er) {
        var e2 = new Error('人員資料已儲存，但官方 LINE 回覆權限沒有存成：' + (er.userMessage || Api.explain(er)));
        e2.userMessage = e2.message; throw e2;
      });
    }).then(function () { dlg.close(); showMsg(''); return reload(); })
      .catch(function (er) {
        $('fErr').textContent = er.userMessage || Api.explain(er);
        if (saved) { editingId = empId; $('fId').disabled = true; return reload().catch(function () {}); }
      })
      .then(function () { busy = false; $('fSave').disabled = false; });
  });

  start();
})();
</script>
<script src="js/appbar.js"></script>
</body>
</html>
